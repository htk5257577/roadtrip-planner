<!doctype html>
<!-- Guided road-trip planner. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#122f2b">
  <title>路书工坊 · Codex 自驾规划器</title>
  <style>
    :root{
      --paper:#f4eddf;--paper-2:#e8dec9;--ink:#183b36;--muted:#6e7c75;
      --pine:#123f37;--pine-2:#0d2d29;--red:#e65c3d;--red-dark:#b73d2a;
      --sun:#f3bd4d;--sky:#8ab9be;--blue:#236d78;--white:#fffdf6;
      --line:rgba(24,59,54,.15);--shadow:0 18px 50px rgba(19,43,38,.13);
      --radius:22px;--sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      --serif:"Songti SC","STSong","Noto Serif CJK SC",serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);background:
      radial-gradient(circle at 8% 0,rgba(243,189,77,.22),transparent 30rem),
      repeating-linear-gradient(0deg,rgba(24,59,54,.025) 0,rgba(24,59,54,.025) 1px,transparent 1px,transparent 5px),var(--paper)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(35,109,120,.26);outline-offset:2px}
    .app{min-height:100vh;padding-bottom:32px}
    .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 22px;color:#fff;background:rgba(13,45,41,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.1)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;color:var(--pine-2);background:var(--sun);font:900 18px Georgia,serif;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
    .brand-copy{min-width:0}.brand-copy b{display:block;font-family:var(--serif);font-size:18px}.brand-copy span{display:block;margin-top:2px;color:#bcd0ca;font-size:10px;letter-spacing:.08em}
    .top-actions{display:flex;align-items:center;gap:8px}
    .prototype-badge{padding:7px 10px;border:1px solid rgba(255,255,255,.18);border-radius:99px;color:#dce7e1;font-size:10px;font-weight:800}
    .session-end{border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:9px 11px;color:#d7e7e1;background:transparent;font-size:10px;font-weight:800}
    .session-end:hover{background:rgba(255,255,255,.1)}
    .primary,.secondary,.ghost,.danger,.status-btn{border:0;border-radius:12px;padding:10px 14px;font-weight:900}
    .primary{color:white;background:var(--red);box-shadow:0 7px 18px rgba(230,92,61,.22)}
    .primary:hover{background:var(--red-dark)}
    .secondary{color:var(--ink);background:var(--sun)}
    .ghost{color:var(--ink);background:transparent;border:1px solid var(--line)}
    .ghost:hover{background:rgba(24,59,54,.06)}
    .danger{color:var(--red-dark);background:#f8dfd7}
    .stagebar{display:flex;align-items:center;gap:7px;padding:12px 22px;overflow:auto;background:rgba(255,253,246,.82);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);scrollbar-width:none}
    .stage{display:flex;align-items:center;gap:7px;white-space:nowrap;border:0;padding:8px 12px;border-radius:99px;color:var(--muted);background:transparent;font-size:12px;font-weight:800}
    .stage i{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;font:900 11px Georgia,serif;background:var(--paper-2);font-style:normal}
    .stage.is-active{color:var(--ink);background:#fff;border:1px solid var(--line);box-shadow:0 5px 15px rgba(24,59,54,.06)}
    .stage.is-active i{color:white;background:var(--red)}
    .stage-divider{width:18px;height:1px;background:var(--line);flex:0 0 auto}
    .panel{min-width:0;background:rgba(255,253,246,.88);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 30px rgba(24,59,54,.06)}
    .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}
    .panel-head h2,.panel-head h3{margin:0;font-family:var(--serif)}
    .panel-head h2{font-size:24px}.panel-head h3{font-size:19px}
    .panel-head p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.55}
    .kicker{display:block;margin-bottom:5px;color:var(--red);font-size:9px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
    .route-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .field{display:grid;gap:5px}.field span{color:var(--muted);font-size:10px;font-weight:800}
    .field input,.field select,.add-row input{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;color:var(--ink);background:#fffdf8}
    .must-list{display:grid;gap:7px;margin:10px 0}
    .must-stop{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 9px;border-radius:12px;background:#fff;border:1px solid rgba(230,92,61,.2)}
    .must-stop .lock{display:grid;place-items:center;width:27px;height:27px;border-radius:9px;color:white;background:var(--red);font-size:12px}
    .must-stop b{font-size:12px}.must-stop small{display:block;margin-top:2px;color:var(--muted);font-size:9px}
    .must-actions{display:flex;gap:3px}.mini{display:grid;place-items:center;width:26px;height:26px;border:0;border-radius:8px;color:var(--muted);background:var(--paper)}
    .mini:hover{color:var(--ink);background:var(--paper-2)}
    .add-row{display:grid;grid-template-columns:1fr auto;gap:7px}
    .place-field{position:relative;min-width:0}.place-field input{width:100%}.place-results{position:absolute;z-index:30;top:calc(100% + 4px);left:0;right:0;max-height:260px;overflow:auto;padding:5px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;box-shadow:var(--shadow)}.place-results[hidden]{display:none}.place-option{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 10px;border:0;border-radius:8px;color:var(--ink);background:transparent;text-align:left;font-size:11px}.place-option:hover,.place-option.is-active{background:#eaf3f2}.place-option small{color:var(--muted);font-size:9px}.place-empty{padding:10px;color:var(--muted);font-size:10px}.framework-block{margin-top:18px;padding-top:17px;border-top:1px solid var(--line)}.framework-block .question-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.framework-block h3{margin:0 0 10px;font:700 19px var(--serif)}.validation-hint{margin-top:12px;color:var(--red-dark);font-size:10px}
    .helper{margin:8px 0 0;color:var(--muted);font-size:9px;line-height:1.55}
    .pref-grid{display:flex;flex-wrap:wrap;gap:7px}.pref-groups{display:grid;gap:14px;margin-top:12px}.pref-group{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fffdf8}.pref-group h3{margin:0 0 9px;color:var(--ink);font-size:11px}
    .pref{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:7px 9px;color:var(--muted);background:#fffdf8;font-size:10px;font-weight:800}
    .pref:after{content:attr(data-state-label);padding:2px 5px;border-radius:99px;background:var(--paper-2);font-size:8px}
    .pref[data-state="prefer"]{color:var(--blue);border-color:rgba(35,109,120,.3);background:#eaf3f2}.pref[data-state="prefer"]:after{background:#cfe5e4}
    .pref[data-state="must"]{color:var(--red-dark);border-color:rgba(230,92,61,.35);background:#fff0e9}.pref[data-state="must"]:after{color:white;background:var(--red)}
    .pref[data-state="avoid"]{color:#6f6462;text-decoration:line-through;background:#eee9e3}.pref[data-state="avoid"]:after{color:white;background:#756c68;text-decoration:none}
    .question-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .question{padding:10px;border-radius:13px;background:var(--paper);border:1px solid rgba(24,59,54,.08)}
    .question label{display:block;margin-bottom:7px;font-size:10px;font-weight:900}.question select,.question input{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff}
    .toggle{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;padding:8px 0;color:var(--ink);background:transparent;font-size:11px;font-weight:800;text-align:left}
    .toggle small{margin-left:7px;padding:3px 6px;border-radius:99px;color:var(--muted);background:#fff;font-size:8px}.toggle.is-on small{color:white;background:var(--pine)}.toggle.is-off small{color:var(--muted);background:#dedbd2}
    .toggle i{position:relative;width:34px;height:20px;border-radius:99px;background:#c7c7c0;font-style:normal;transition:.2s}.toggle i:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:white;transition:.2s}
    .toggle.is-on i{background:var(--pine)}.toggle.is-on i:after{transform:translateX(14px)}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .metric{padding:11px;border-radius:13px;background:rgba(255,253,246,.82);border:1px solid var(--line)}
    .metric b{display:block;font:900 19px/1 Georgia,serif;color:var(--red)}.metric b.is-pending{color:var(--muted);font:900 13px/1.15 var(--sans)}.metric span{display:block;margin-top:5px;color:var(--muted);font-size:8px;line-height:1.35}
    .map-card{overflow:hidden;background:#e8eee8}.map-canvas{position:relative;display:grid;place-items:center;min-height:350px;background:#e8eee8}.map-canvas.has-map{display:block;min-height:0}.map-canvas img{display:block;width:100%;height:auto}.map-canvas svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.map-placeholder{max-width:270px;padding:28px;color:var(--muted);text-align:center;font-size:11px;line-height:1.7}.map-placeholder b{display:block;margin-bottom:5px;color:var(--ink);font:700 20px var(--serif)}.map-points{display:grid;gap:6px;padding:12px;background:#fffdf6;border-top:1px solid var(--line)}.map-point{display:flex;align-items:center;gap:7px;font-size:9px;color:var(--ink)}.map-point i{flex:0 0 auto;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font:900 9px var(--sans)}.map-point.is-missing{color:var(--muted)}.map-point.is-missing i{background:#a4aaa3}.map-caption{padding:0 12px 12px;color:var(--muted);background:#fffdf6;font-size:9px;line-height:1.5}
    .map-overlay{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:end;justify-content:space-between;gap:10px;pointer-events:none}
    .map-legend{max-width:68%;padding:10px 12px;border:1px solid rgba(255,255,255,.55);border-radius:14px;background:rgba(255,253,246,.84);backdrop-filter:blur(10px);font-size:9px;line-height:1.6;box-shadow:0 9px 24px rgba(24,59,54,.1)}
    .legend-row{display:flex;gap:9px;flex-wrap:wrap}.legend-row span{display:flex;align-items:center;gap:4px}.dot{width:8px;height:8px;border-radius:50%}.dot.locked{background:var(--red)}.dot.selected{background:var(--pine)}.dot.optional{border:2px solid var(--blue);background:white}
    .map-mode{padding:9px 11px;border-radius:12px;color:#fff;background:var(--pine);font-size:9px;font-weight:900}
    .route-string{display:flex;align-items:center;gap:6px;padding:12px 0 3px;overflow:auto;scrollbar-width:none}
    .route-node{flex:0 0 auto;padding:7px 9px;border-radius:99px;font-size:9px;font-weight:900;border:1px solid var(--line);background:#fff}.route-node.hard{color:var(--red-dark);border-color:rgba(230,92,61,.28)}.route-node.soft{color:white;background:var(--pine);border-color:var(--pine)}
    .route-arrow{color:#a69b89;font-size:10px}
    .candidate{position:relative;padding:14px;border-radius:17px;border:1px solid var(--line);background:#fffdf8;overflow:hidden}
    .candidate[data-status="selected"]{border-color:rgba(18,63,55,.42);box-shadow:inset 4px 0 0 var(--pine)}
    .candidate[data-status="excluded"]{opacity:.58;filter:grayscale(.4)}
    .candidate-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.candidate-title h3{margin:0;font-family:var(--serif);font-size:18px}.candidate-title small{display:block;margin-top:4px;color:var(--muted);font-size:9px}
    .score{display:grid;place-items:center;min-width:45px;height:45px;border-radius:50%;color:white;background:var(--pine);font:900 14px Georgia,serif}.score small{font:700 7px var(--sans)}
    .candidate-reason{margin:10px 0;color:var(--ink);font-size:10px;line-height:1.6}
    .candidate-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.fact{padding:7px;border-radius:9px;background:var(--paper);font-size:8px;color:var(--muted)}.fact b{display:block;margin-bottom:2px;color:var(--ink);font-size:10px}
    .tags{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:9px}.tag{padding:4px 6px;border-radius:99px;color:var(--blue);background:#e9f2f1;font-size:8px;font-weight:800}.tag-label{margin-right:3px;color:var(--muted);font-size:9px;font-weight:800}.candidate-warning{margin:9px 0 0;color:var(--red-dark);font-size:10px;font-weight:800}
    .candidate-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:10px}.status-btn{padding:8px 6px;color:var(--muted);background:var(--paper);font-size:9px}.status-btn.is-active[data-status-choice="selected"]{color:white;background:var(--pine)}.status-btn.is-active[data-status-choice="excluded"]{color:white;background:#7a706c}
    .ai-note{padding:12px;border-radius:14px;background:#fff0d2;border:1px solid rgba(243,189,77,.4);font-size:9px;line-height:1.65}.ai-note b{color:var(--red-dark)}
    .ai-run-state{display:flex;align-items:center;justify-content:center;gap:8px;min-height:34px;padding:7px 18px;color:#cfe1da;background:#17483f;border-bottom:1px solid rgba(255,255,255,.08);font-size:10px;font-weight:800;text-align:center}
    .ai-run-state[data-status="loading"]{color:#172f2b;background:var(--sun)}.ai-run-state[data-status="error"]{color:white;background:var(--red-dark)}.ai-run-state[data-status="ready"]{color:#d7eee6;background:#176153}.ai-run-state[data-status="ended"]{color:#d7eee6;background:#33524b}.ai-run-state[data-status="mock"]{color:#423211;background:#f3bd4d}
    .ai-pulse{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 1.4s infinite}.ai-run-state:not([data-status="loading"]) .ai-pulse{animation:none}
    .ai-report-frame{display:block;width:100%;height:76vh;min-height:680px;border:0;background:white}.ai-result-summary{padding:16px 20px;color:var(--ink);background:#fff0d2;border-bottom:1px solid var(--line);font-size:11px;line-height:1.65}.ai-result-summary b{color:var(--red-dark)}
    button:disabled{cursor:wait;opacity:.58}
    @keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

    /* Guided planning workspace */
    .guide-shell{width:min(1180px,calc(100% - 28px));margin:28px auto}.guide-hero{position:relative;overflow:hidden;display:block;min-height:330px;padding:42px 40px;border-radius:30px;color:white;background:linear-gradient(135deg,var(--pine-2),#1d6254);box-shadow:var(--shadow)}
    .guide-hero:after{content:"";position:absolute;width:360px;height:360px;right:-120px;top:-190px;border:70px solid rgba(243,189,77,.13);border-radius:50%}.guide-hero h1{position:relative;margin:7px 0 14px;font:700 clamp(34px,6vw,66px)/.98 var(--serif);letter-spacing:-.04em}.guide-hero p{position:relative;max-width:620px;margin:0;color:#cfe1da;font-size:13px;line-height:1.8}.guide-summary{position:relative;display:grid;align-content:end;gap:8px}.guide-summary .metric{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.13)}.guide-summary .metric span{color:#b9d2ca}
    .guide-hero>div{position:relative;z-index:1;max-width:820px}.guide-hero p{max-width:760px}
    .route-band{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:14px;margin-top:14px;padding:13px 17px}.route-band-title{padding-right:14px;border-right:1px solid var(--line)}.route-band-title b{display:block;font:700 17px var(--serif)}.route-band-title small{display:block;margin-top:4px;color:var(--muted);font-size:8px}.route-band .route-string{padding:0;min-width:0}
    .guide-body{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;margin-top:18px}.guide-main{padding:24px}.guide-side{position:sticky;top:118px;align-self:start;display:grid;align-content:start;gap:12px}.guide-side>.panel:not(.map-card){padding:15px}.guide-map-label{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 3px 0}.guide-map-label b{font:700 15px var(--serif)}.guide-map-label small{max-width:150px;text-align:right;color:var(--muted);font-size:8px}.guide h2{font:700 32px/1.1 var(--serif)}
    .global-state{overflow:hidden;padding:0!important;background:var(--pine-2)!important;color:#edf4f0;border-color:rgba(255,255,255,.08)}.global-state-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:15px 15px 12px;border-bottom:1px solid rgba(255,255,255,.1)}.global-state-head h3{margin:3px 0 0;color:var(--sun);font:700 18px var(--serif)}.global-state-head p{margin:4px 0 0;color:#91aea6;font-size:8px}.phase-chip{padding:6px 8px;border-radius:99px;color:#d7e7e1;background:rgba(255,255,255,.08);font:900 8px Georgia,serif}.global-state-grid{display:grid;grid-template-columns:1fr 1fr}.global-cell{min-width:0;padding:12px 14px;border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}.global-cell:nth-child(2n){border-right:0}.global-cell b{display:block;color:#fff;font:900 17px/1 Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.global-cell b.pending{color:#87a59d;font:900 12px/1 var(--sans)}.global-cell span{display:block;margin-top:5px;color:#8fa9a2;font-size:8px}.global-state-foot{display:flex;flex-wrap:wrap;gap:6px;padding:11px 14px}.global-state-foot span{padding:5px 7px;border-radius:99px;color:#bad0c9;background:rgba(255,255,255,.07);font-size:8px}
    .guide-route-builder{display:grid;grid-template-columns:1fr 1fr;gap:18px}.guide-route-builder .route-editor{padding-right:18px;border-right:1px solid var(--line)}
    .guide-candidate-focus{display:grid;grid-template-columns:45px minmax(0,1fr) 45px;gap:12px;align-items:center}.focus-arrow{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;color:var(--ink);background:white}.arrow-label{display:none}.focus-card{padding:22px;border-radius:24px;background:linear-gradient(150deg,#fffdf8,#ece1cd);border:1px solid var(--line)}.focus-card .candidate-title h3{font-size:28px}.focus-card .candidate-reason{font-size:12px}.focus-count{text-align:center;margin-top:12px;color:var(--muted);font-size:10px}

    /* Fixed report preview */

    const mapPlaces = () => routeNodes().map(node => {
      const place=locationByLabel.get(node.name);
      return { name:node.name, ...(place?{code:place[0]}:{}), query:place?[place[3],place[2],place[1]].filter(Boolean).filter((part,index,parts)=>parts.indexOf(part)===index).join(' '):node.name };
    });
    const coordFor = name => {
      if(cityCatalog[name]) return cityCatalog[name];
      const place=locationByLabel.get(name);
      if(!place || place[5] !== 2) return null;
      return cityCatalog[place[1].replace(/市$|地区$|自治州$|盟$/,'')] || null;
    };
    const datesReady = () => {
      if (!state.answers.departDate || !state.answers.returnDate) return false;
      const start = new Date(`${state.answers.departDate}T00:00:00`);
      const end = new Date(`${state.answers.returnDate}T00:00:00`);
      return Number.isFinite(start.getTime()) && Number.isFinite(end.getTime()) && end >= start;
    };
    const frameworkReady = () => Boolean(state.route.start && state.route.end && state.route.must.length && state.answers.departTime && datesReady());
    const planningReady = () => frameworkReady() && Number(state.answers.maxDrive) > 0 && Number(state.answers.maxDetour) > 0 && state.answers.pet!==null && state.answers.ev!==null && (!state.answers.ev || Number(state.answers.evHighwayRange)>=100 && Number(state.answers.evHighwayRange)<=1000);
    const chargeHoursFor = km => state.answers.ev && Number(state.answers.evHighwayRange)>0 ? km/Number(state.answers.evHighwayRange)*.45 : 0;

    function roadLeg(from,to){
      const exact=roadLegs[`${from.name}>${to.name}`];
      if(exact) return { ...exact, source:'amap' };
      if(!Number.isFinite(from.lon)||!Number.isFinite(from.lat)||!Number.isFinite(to.lon)||!Number.isFinite(to.lat)) return { km:null, hours:null, source:'unlocated' };
      const km=haversine(from,to)*1.22;
      return { km, hours:km/82, source:'estimate' };
    }

    function routeRoadStats(nodes){
      let km=0, driveHours=0, exactLegs=0, unlocated=0;
      const legs=[];
      for(let i=1;i<nodes.length;i++){
        const leg=roadLeg(nodes[i-1],nodes[i]);
        if(leg.source==='unlocated') unlocated++;
        else {km+=leg.km; driveHours+=leg.hours; if(leg.source==='amap')exactLegs++;}
        legs.push({ from:nodes[i-1].name, to:nodes[i].name, ...leg });
      }
      return { km:unlocated?null:km, driveHours:unlocated?null:driveHours, chargeHours:unlocated?null:chargeHoursFor(km), source:unlocated?'unlocated':exactLegs===legs.length?'amap':exactLegs?'mixed':'estimate', legs };
    }

    function candidateScore(c){
      let score = 63;
      c.tags.forEach(tag => {
        const mode = state.prefs[tag];
        if (mode === 'must') score += 9;
        if (mode === 'prefer') score += 5;
        if (mode === 'avoid') score -= 15;
      });
      if (state.answers.pet && /友好|户外|基地/.test(c.pet)) score += 4;
      if (state.answers.pet && /不适合|禁入/.test(c.pet)) score -= 7;
      if (state.answers.ev && /预留|县道|山脚/.test(c.ev)) score -= 3;
      const impact=candidateDetour(c);
      if(Number.isFinite(impact.drive) && Number(state.answers.maxDetour)>0 && impact.drive>Number(state.answers.maxDetour)) score-=18;
      return Math.max(38, Math.min(97, score));
    }

    function routeNodes(selectedOverride){
      const anchors = [state.route.start, ...state.route.must, state.route.end].filter(Boolean).map((name, index) => ({ name, kind:'hard', index, ...(coordFor(name) || {}) }));
      const included=(selectedOverride || selectedCandidates()).slice().sort((a,b) => a.order-b.order);
      included.forEach(candidate => {
        const anchorNames = anchors.map(n => n.name);
        let index = candidate.after === state.route.start ? 0 : anchorNames.indexOf(candidate.after);
        if (index < 0) index = Math.max(0, anchors.length - 2);
        while (anchors[index + 1] && anchors[index + 1].kind === 'soft' && anchors[index + 1].after === candidate.after && anchors[index + 1].order <= candidate.order) index++;
        anchors.splice(index + 1, 0, { name:candidate.name, kind:'soft', after:candidate.after, order:candidate.order, ...coordFor(candidate.name), candidate });
      });
      return anchors;
    }

    function candidateImpact(candidate){
      const without=selectedCandidates().filter(item=>item.id!==candidate.id);
      const withCandidate=[...without,candidate];
      const base=routeRoadStats(routeNodes(without));
      const next=routeRoadStats(routeNodes(withCandidate));
      if(base.km===null||next.km===null) return {km:null,drive:null,source:'unlocated'};
      const baseTotalHours=base.driveHours+base.chargeHours;
      const nextTotalHours=next.driveHours+next.chargeHours;
      return {
        km:Number((next.km-base.km).toFixed(1)),
        drive:Number((nextTotalHours-baseTotalHours).toFixed(1)),
        source:base.source==='amap'&&next.source==='amap'?'amap':'mixed'
      };
    }
    const candidateDetour = candidate => ['codex','mock'].includes(state.ai.source) ? {km:candidate.detour,drive:candidate.drive,source:state.ai.source} : candidateImpact(candidate);

    function haversine(a,b){
      if (!a || !b || !Number.isFinite(a.lat) || !Number.isFinite(b.lat)) return null;
      const toRad = v => v * Math.PI / 180;
      const dLat = toRad(b.lat-a.lat), dLon = toRad(b.lon-a.lon);
      const x = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
      return 6371 * 2 * Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
    }

    function routeStats(){
      const nodes = routeNodes();
      const road=routeRoadStats(nodes);
      const km=road.km;
      const drive=road.driveHours===null?null:road.driveHours+road.chargeHours;
      const stayDays = nodes.slice(1,-1).reduce((sum,node) => sum + (node.candidate?.stay ?? coordFor(node.name)?.stay ?? 1),0);
      const play = stayDays * 7;
      if (!planningReady() || km===null) return { km:km===null?null:Number(km.toFixed(1)), drive:drive===null?null:Number(drive.toFixed(1)), play:Math.round(play), pressure:null, availableDays:null, load:null, source:road.source, road };
      const availableDays = Math.floor((new Date(`${state.answers.returnDate}T00:00:00`)-new Date(`${state.answers.departDate}T00:00:00`))/86400000)+1;
      const load = (drive / Number(state.answers.maxDrive) + stayDays) / availableDays;
      const pressure = load <= .72 ? '舒缓' : load <= .98 ? '均衡' : '偏赶';
      return { km:Number(km.toFixed(1)), drive:Number(drive.toFixed(1)), play:Math.round(play), pressure, availableDays, load, source:road.source, road };
    }

    function addDays(date,count){ const next = new Date(date); next.setDate(next.getDate()+count); return next; }
    function formatDate(date){ return `${date.getMonth()+1}/${date.getDate()}`; }

    function schedule(){
      if (!planningReady()) return [];
      const nodes = routeNodes();
      const days = [];
      let date = new Date(`${state.answers.departDate}T00:00:00`);
      days.push({ date:formatDate(date), title:`${state.answers.departTime} 从${state.route.start}出发`, subtitle:'夜间启程', plan:'只推进到安全状态允许的位置；充电与休息按实时路况决定。', drive:4.5, play:.5, stay:'弹性休息走廊' });
      for(let i=1;i<nodes.length;i++){
        date = addDays(date,1);
        const from = nodes[i-1], to = nodes[i];
        const leg = roadLeg(from,to);
        const km = leg.km;
        const charge = km===null ? 0 : chargeHoursFor(km);
        const drive = leg.hours===null ? null : Math.max(.5, leg.hours + charge);
        const profile = to.candidate || coordFor(to.name) || { stay:1, highlight:'按兴趣生成当地核心体验' };
        const stay = to.name === state.route.end && i === nodes.length-1 ? 0 : (profile.stay ?? 1);
        const play = drive===null ? null : stay === 0 ? .5 : Math.max(2,Math.min(5.5,stay*5.2-Math.max(0,drive-4)*.35));
        const plan = profile.highlight || profile.reason || '抵达后安排该地最有区分度的体验。';
        days.push({ date:formatDate(date), title:`${from.name} → ${to.name}`, subtitle:km===null?'道路距离与驾驶时间待核验':`${leg.source==='amap'?'高德道路快照':'道路估算'} ${km.toFixed(1)} km · ${drive.toFixed(1)}h${state.answers.ev?' 含补能':''}`, plan:drive > Number(state.answers.maxDrive) ? `长转场，拆成弹性休息区间；抵达后：${plan}` : plan, drive, play, stay:stay ? `${to.name} · ${stay} 天` : '返程抵达' });
        const fullDays = Math.max(0,Math.floor(stay-.6));
        for(let j=0;j<fullDays;j++){
          date = addDays(date,1);
          days.push({ date:formatDate(date), title:`${to.name}完整体验日${fullDays>1 ? ` ${j+1}` : ''}`, subtitle:'少开车，把时间留在目的地', plan, drive:.5, play:7.5, stay:`${to.name}住宿区` });
        }
      }
      return days;
    }

    function header(){
      const working=state.ai.status==='loading';
      const action=state.stage<3?'ai-candidates':state.stage===3?'ai-preview':state.stage===4?'ai-plan':'open-report';
      const actionLabel=state.stage<3?'让 Codex 推荐':state.stage===3?'生成预览':state.stage===4?'生成完整计划':state.ai.source==='mock'?'模拟结果':'打开完整计划';
      return `<header class="topbar">
        <div class="brand"><div class="brand-mark">R</div><div class="brand-copy"><b>路书工坊</b><span>CODEX-NATIVE ROADTRIP PLANNER</span></div></div>
        <div class="top-actions"><span class="prototype-badge">${working?'Codex 正在处理':state.ai.source==='mock'?'模拟预览':state.ai.backendReady?'当前会话在线':'等待当前会话'}</span><button class="secondary" type="button" data-action="show-state">查看已确认条件</button><button class="session-end" type="button" data-action="end-session" ${working||state.ai.ended?'disabled':''}>结束会话</button>${state.stage===5&&state.ai.reportUrl?`<button class="secondary refine-trigger" type="button" data-action="refine-open" ${working?'disabled':''}>微调</button>`:''}<button class="primary" type="button" data-action="${action}" ${working||state.ai.ended||state.stage===5&&state.ai.source==='mock'?'disabled':''}>${working?'Codex 运行中…':actionLabel}</button></div>
      </header>${aiStatusStrip()}${stageBar()}`;
    }

    function aiStatusStrip(){
      const status=state.ai.source==='mock'?'mock':state.ai.status==='idle'&&state.ai.backendReady?'ready':state.ai.status;
      const fallback=state.ai.backendReady?'当前 Codex 会话正在等待网页操作；运行过程在 Codex 对话中可见。':'请回到 Codex 对话，让它启动页面并保持等待。';
      return `<div class="ai-run-state" data-status="${esc(status)}"><i class="ai-pulse"></i><span>${esc(state.ai.source==='mock'?'调试模式：当前候选与路书预览都是模拟数据，没有调用 Codex。':state.ai.message||fallback)}</span></div>`;
    }

    function stageBar(){
      const stages = [['基础行程','地点与时间'],['旅行偏好','旅行约束'],['候选点','加入 / 排除'],['生成预览','核对路线与时间'],['完整计划','南线模板路书']];
      return `<nav class="stagebar" aria-label="规划步骤">${stages.map((item,index) => `<button type="button" class="stage ${state.stage===index+1?'is-active':''}" data-stage="${index+1}"><i>${index+1}</i><span>${item[0]}</span></button>${index<stages.length-1?'<span class="stage-divider"></span>':''}`).join('')}</nav>`;
    }

    function placeInput(field,placeholder){
      const value=field==='must'?'':state.route[field];
      const id=field==='must'?'newMustStop':`route-${field}`;
      return `<div class="place-field"><input id="${id}" type="text" value="${esc(value)}" placeholder="${esc(placeholder)}" data-place-field="${field}" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="${id}-results" autocomplete="off"><div class="place-results" id="${id}-results" role="listbox" hidden></div></div>`;
    }

    function routeEditor(){
      return `<div class="route-editor">
        <div class="route-inputs">
          <div class="field"><span>从哪里出发</span>${placeInput('start','搜索出发地')}</div>
          <div class="field"><span>最终到哪里</span>${placeInput('end','搜索终点')}</div>
        </div>
        <span class="kicker">一定要去</span>
        <div class="must-list">${state.route.must.length?state.route.must.map((name,index) => `<div class="must-stop"><span class="lock">◆</span><div><b>${esc(name)}</b><small>必去 · AI 不得删除</small></div><div class="must-actions"><button type="button" class="mini" data-action="move-stop" data-index="${index}" data-dir="-1" aria-label="上移">↑</button><button type="button" class="mini" data-action="move-stop" data-index="${index}" data-dir="1" aria-label="下移">↓</button><button type="button" class="mini" data-action="remove-stop" data-index="${index}" aria-label="删除">×</button></div></div>`).join(''):'<p class="helper">还没有必去点，至少添加一个。</p>'}</div>
        <div class="add-row">${placeInput('must','搜索城市、县，或输入景点')}<button type="button" class="primary" data-action="add-stop">加入必去</button></div>
        <p class="helper">支持全国省、市、区县模糊搜索；也可输入景点或海岛名称。必去点按加入顺序排列，可随时调整。行政区划数据为 2026 年 4 月快照。</p>
      </div>`;
    }

    function timeEditor(){
      return `<div class="framework-block"><h3>什么时候出发与结束？</h3><div class="question-grid">
        <label class="question"><span>出发日期</span><input type="date" value="${state.answers.departDate}" data-answer="departDate"></label>
        <label class="question"><span>结束日期</span><input type="date" value="${state.answers.returnDate}" data-answer="returnDate"></label>
        <label class="question"><span>出发时间</span><input type="time" value="${state.answers.departTime}" data-answer="departTime"></label>
      </div><p class="helper">先确定可用时间，下一步才能判断加入沿途点是否值得。</p></div>`;
    }

    function preferenceEditor(){
      const groups=Object.entries(tagGroups).map(([group,keys])=>`<section class="pref-group"><h3>${esc(group)}</h3><div class="pref-grid">${keys.map(key=>{const mode=state.prefs[key]||'off';return `<button type="button" class="pref" data-pref="${esc(key)}" data-state="${mode}" data-state-label="${preferenceLabels[mode]}">${esc(key)}</button>`;}).join('')}</div></section>`).join('');
      return `<div><span class="kicker">目的地标签</span><div class="pref-groups">${groups}</div><p class="helper">一个城市可有多个标签。点击循环：未选 → 偏好 → 必有 → 避开；这里仅描述想体验什么，宠物、驾驶和补能条件单独判断。</p></div>`;
    }

    function questions(){
      const toggle=(key,label)=>`<button type="button" class="toggle ${state.answers[key]===true?'is-on':state.answers[key]===false?'is-off':''}" data-toggle="${key}"><span>${label}<small>${state.answers[key]===null?'未选':state.answers[key]?'是':'否'}</small></span><i></i></button>`;
      return `<div class="question-grid">
        <label class="question"><span>单日舒适驾驶</span><select data-answer="maxDrive"><option value="" ${state.answers.maxDrive===''?'selected':''}>请选择</option><option value="4" ${state.answers.maxDrive==='4'?'selected':''}>约 4 小时</option><option value="6" ${state.answers.maxDrive==='6'?'selected':''}>约 6 小时</option><option value="8" ${state.answers.maxDrive==='8'?'selected':''}>约 8 小时</option></select></label>
        <label class="question"><span>可接受的额外绕路</span><select data-answer="maxDetour"><option value="" ${state.answers.maxDetour===''?'selected':''}>请选择</option><option value="1" ${state.answers.maxDetour==='1'?'selected':''}>最多 1 小时</option><option value="2" ${state.answers.maxDetour==='2'?'selected':''}>最多 2 小时</option><option value="4" ${state.answers.maxDetour==='4'?'selected':''}>最多 4 小时</option><option value="999" ${state.answers.maxDetour==='999'?'selected':''}>不设上限</option></select><small>对比不去该候选点的路线，计算增加的驾驶与补能时间。</small></label>
        <label class="question"><span>旅行节奏</span><select data-answer="pace"><option value="" ${state.answers.pace===''?'selected':''}>请选择</option><option value="relaxed" ${state.answers.pace==='relaxed'?'selected':''}>松弛：宁可少去</option><option value="balanced" ${state.answers.pace==='balanced'?'selected':''}>均衡</option><option value="dense" ${state.answers.pace==='dense'?'selected':''}>高密度</option></select></label>
        <div class="question">${toggle('pet','带宠物')}${toggle('ev','纯电车')}<p class="helper">点击选择：未选 → 是 → 否。</p></div>
        <div class="question"><span>可选的游玩限制</span><div class="pref-grid"><button type="button" class="pref" data-filter="lowEffort" data-state="${state.answers.lowEffort?'prefer':'off'}" data-state-label="${state.answers.lowEffort?'已选':'未选'}">少爬山少步行</button><button type="button" class="pref" data-filter="lowCrowd" data-state="${state.answers.lowCrowd?'prefer':'off'}" data-state-label="${state.answers.lowCrowd?'已选':'未选'}">尽量避开拥挤</button></div><small>这是行程限制，不是城市标签。</small></div>
        ${state.answers.ev?`<label class="question"><span>实际高速续航</span><input type="number" min="100" max="1000" step="10" inputmode="numeric" placeholder="例如 350" value="${esc(state.answers.evHighwayRange)}" data-answer="evHighwayRange"><small>填你日常高速能稳定跑到的公里数，不是车辆标称续航；只用于补能粗估。</small></label>`:''}
      </div>`;
    }

    function metrics(){
      if (state.stage === 1) return `<div class="metrics"><div class="metric"><b>${state.route.must.length}</b><span>已锁定必去点</span></div><div class="metric"><b class="is-pending">尚未选择</b><span>沿途候选点</span></div><div class="metric"><b class="is-pending">暂不估算</b><span>最终路线与里程</span></div><div class="metric"><b class="is-pending">${datesReady()?`${Math.floor((new Date(state.answers.returnDate)-new Date(state.answers.departDate))/86400000)+1} 天`:'待填写'}</b><span>可用旅行时间</span></div></div>`;
      if (!planningReady()) return `<div class="metrics"><div class="metric"><b>${state.route.must.length}</b><span>已锁定必去点</span></div><div class="metric"><b>${datesReady()?Math.floor((new Date(state.answers.returnDate)-new Date(state.answers.departDate))/86400000)+1:'—'}</b><span>可用旅行天数</span></div><div class="metric"><b class="is-pending">待确认</b><span>驾驶与同行约束</span></div><div class="metric"><b class="is-pending">尚未计算</b><span>驾驶压力</span></div></div>`;
      const stats = routeStats();
      if(stats.km===null) return `<div class="metrics"><div class="metric"><b>${state.route.must.length}</b><span>已锁定必去点</span></div><div class="metric"><b>${Math.floor((new Date(state.answers.returnDate)-new Date(state.answers.departDate))/86400000)+1}天</b><span>可用旅行时间</span></div><div class="metric"><b class="is-pending">待核验</b><span>路线里程</span></div><div class="metric"><b class="is-pending">待核验</b><span>驾驶压力</span></div></div>`;
      const scope = selectedCandidates().length ? '当前路线' : '仅必去点基线';
      const sourceLabel=stats.source==='amap'?'高德道路快照':'含估算路段';
      return `<div class="metrics"><div class="metric"><b>${stats.km.toLocaleString('zh-CN',{maximumFractionDigits:1})}</b><span>${scope} · ${sourceLabel} km</span></div><div class="metric"><b>${stats.drive}h</b><span>驾驶＋${state.answers.ev?'补能':'休息'}估算</span></div><div class="metric"><b>${stats.availableDays}天</b><span>已确认可用时间</span></div><div class="metric"><b>${stats.pressure}</b><span>${scope} · 驾驶压力</span></div></div>`;
    }

    function routeString(){
      const nodes=routeNodes();
      return `<div class="route-string">${nodes.length?nodes.map((node,index) => `${index?'<span class="route-arrow">→</span>':''}<span class="route-node ${node.kind}" ${node.tags?.length?`title="体验标签：${esc(node.tags.join('、'))}"`:''}>${node.kind==='hard'?'◆':'＋'} ${esc(node.name)}</span>`).join(''):'<span class="helper">选择出发地、必去点与终点后，这里会显示顺序。</span>'}</div>`;
    }

    function mapView(){
      const places=mapPlaces();
      const preview=mapPreviews.get(JSON.stringify(places));
      const pointRows=(preview?.points||places).map((point,index)=>`<div class="map-point ${point.error?'is-missing':''}"><i>${point.error?'?':index+1}</i><span>${esc(point.name)}${point.error?` · ${esc(point.error)}`:point.verified===false?' · 地名匹配，待核验':''}</span></div>`).join('');
      const points=(preview?.points||[]).filter(point=>Number.isFinite(point.x)&&Number.isFinite(point.y));
      const path=points.map(point=>`${point.x},${point.y}`).join(' ');
      const markers=points.map(point=>`<g transform="translate(${point.x} ${point.y})"><circle r="16" fill="#e65c3d" stroke="#fffdf6" stroke-width="4"/><text text-anchor="middle" y="4" fill="#fff" font-size="12" font-weight="900">${(preview.points.indexOf(point)+1)}</text></g>`).join('');
      const overlay=`<svg viewBox="0 0 760 600" aria-hidden="true">${points.length>1?`<polyline points="${path}" fill="none" stroke="#fffdf6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${path}" fill="none" stroke="#e65c3d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`:''}${markers}</svg>`;
      const canvas=preview?.imageUrl?`<img src="${esc(preview.imageUrl)}" alt="高德地图：${esc(places.map(place=>place.name).join(' → '))}" loading="eager">${overlay}`:`<div class="map-placeholder"><b>${places.length?'地图正在定位':'路线从这里开始'}</b>${preview?.error?esc(preview.error):places.length?'正在从高德加载已选地点和真实底图…':'选定出发地、终点或必去点后，这里会显示地图。'}</div>`;
      return `<div class="panel map-card"><div class="map-canvas ${preview?.imageUrl?'has-map':''}">${canvas}</div>${places.length?`<div class="map-points">${pointRows}</div><div class="map-caption">高德底图 · 县市点表示行政地名位置，不是景区入口；红线仅表示途经顺序，不是实际驾车道路。</div>`:''}</div>`;
    }

    async function refreshMapPreview(){
      if(location.protocol==='file:') return;
      const places=mapPlaces();
      if(!places.length) return;
      const key=JSON.stringify(places);
      if(mapPreviews.has(key)||pendingMapPreviews.has(key)) return;
      pendingMapPreviews.add(key);
      try{
        const response=await fetch('/api/map/preview',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({places})});
        const data=await response.json();
        if(!response.ok||!data.ok) throw new Error(data.error||'地图加载失败');
        mapPreviews.set(key,data);
      }catch(error){mapPreviews.set(key,{error:error.message,points:places.map(place=>({name:place.name,error:'待定位'}))});}
      finally{
        pendingMapPreviews.delete(key);
        if(JSON.stringify(mapPlaces())===key){
          const card=app.querySelector('.map-card');
          if(card) card.outerHTML=mapView();
        }
      }
    }

    function candidateCard(c, focus=false){
      const status=statusOf(c.id), score=candidateScore(c);
      const impact=candidateDetour(c);
      const sign=value=>value>0?'+':'';
      const sourceLabel=impact.source==='codex'?'Codex 核验增量':impact.source==='mock'?'模拟绕路数据':impact.source==='amap'?'高德道路增量':impact.source==='unlocated'?'地点待定位':'粗略估算';
      return `<article class="candidate ${focus?'focus-card':''}" data-status="${status}">
        <div class="candidate-top"><div class="candidate-title"><h3>${esc(c.name)}</h3><small>${esc(c.segment)} · ${status==='selected'?'已加入路线':status==='excluded'?'已排除':'等待你的决定'}</small></div><div class="score">${score}<small>/100</small></div></div>
        <p class="candidate-reason"><b>为什么出现：</b>${esc(c.reason)}</p>
        <div class="candidate-facts"><div class="fact"><b>${impact.km===null?'待核验':`${sign(impact.km)}${impact.km} km`}</b>${sourceLabel}</div><div class="fact"><b>${impact.drive===null?'待核验':`${sign(impact.drive)}${impact.drive} h`}</b>额外驾驶${state.answers.ev?'＋补能':''}</div><div class="fact"><b>${c.stay} 天</b>建议停留</div></div>
        ${impact.drive!==null && Number(state.answers.maxDetour)<999 && impact.drive>Number(state.answers.maxDetour)?`<p class="candidate-warning">比你设定的绕路上限多 ${+(impact.drive-Number(state.answers.maxDetour)).toFixed(1)} 小时</p>`:''}
        <div class="tags"><span class="tag-label">适合体验</span>${c.tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div><div class="tags"><span class="tag">🐾 ${esc(c.pet)}</span><span class="tag">⚡ ${esc(c.ev)}</span></div>
        <div class="candidate-actions"><button type="button" class="status-btn ${status==='selected'?'is-active':''}" data-candidate="${c.id}" data-status-choice="selected">加入路线</button><button type="button" class="status-btn ${status==='excluded'?'is-active':''}" data-candidate="${c.id}" data-status-choice="excluded">排除</button></div>
      </article>`;
    }

    function routeOrderBand(){
      return `<section class="panel route-band"><div class="route-band-title"><span class="kicker">当前顺序</span><b>${state.stage<3?'必去点骨架':'当前路线'}</b><small>${state.stage<3?'候选加入后会在这里插入':'与地图和计划保持一致'}</small></div>${routeString()}</section>`;
    }

    function globalDashboard(){
      const ready=planningReady(), reviewed=previewCurrent(), preview=reviewed?state.ai.preview:null, stats=routeStats(), located=ready&&(reviewed?Number.isFinite(preview.totals.distanceKm):stats.km!==null);
      const selected=selectedCandidates().length, excluded=excludedCandidates().length;
      const reviewedCount=candidates.filter(c=>statusOf(c.id)!=='none').length;
      const stageName=['','基础行程','旅行偏好','候选评审','路线预览','完整计划'][state.stage];
      const cell=(value,label,pending=false)=>`<div class="global-cell"><b class="${pending?'pending':''}">${value}</b><span>${label}</span></div>`;
      const selectionVisible=state.stage>=3;
      const cells=[
        cell(state.route.must.length,'已锁定必去点'),
        cell(selectionVisible?selected:'—',selectionVisible?'已加入沿途点':'候选尚未生成',!selectionVisible),
        cell(selectionVisible?excluded:'—',selectionVisible?'已排除沿途点':'候选尚未评审',!selectionVisible),
        cell(datesReady()?`${Math.floor((new Date(state.answers.returnDate)-new Date(state.answers.departDate))/86400000)+1}天`:'—',datesReady()?'可用旅行时间':'时间尚未填完整',!datesReady()),
        cell(located?(preview?preview.totals.distanceKm:stats.km).toLocaleString('zh-CN',{maximumFractionDigits:1}):'待核验',located?(preview?`${esc(preview.totals.distanceSource)} · km`:stats.source==='amap'?'高德道路快照 · km':'粗略估算 · km'):'路线里程',!located),
        cell(located&&(preview?Number.isFinite(preview.totals.driveHours)&&Number.isFinite(preview.totals.chargeHours):stats.drive!==null)?`${preview?(preview.totals.driveHours+preview.totals.chargeHours).toFixed(1):stats.drive}h`:'待核验',located?`驾驶＋${state.answers.ev?'补能':'休息'}估算`:'驾驶时长',!located),
        cell(ready?`${preview?preview.totals.playHours:stats.play}h`:'—',ready?preview?'预览安排的游玩':'目的地建议体验':'游玩时间待安排',!ready),
        cell(located?(preview?preview.totals.pressure:stats.pressure):'待核验',located?'当前驾驶压力':'驾驶压力',!located)
      ].join('');
      const foot=[
        datesReady()?`${state.answers.departDate}—${state.answers.returnDate}`:'日期待填写',
        state.answers.maxDrive?`舒适驾驶 ≤ ${state.answers.maxDrive}h/天`:'驾驶上限待选择',
        state.answers.maxDetour?`额外绕路 ${state.answers.maxDetour==='999'?'不限':`≤ ${state.answers.maxDetour}h`}`:'绕路上限待选择',
        state.stage>=3?`候选已处理 ${reviewedCount}/${candidates.length}`:'候选尚未开始',
        state.answers.ev?`纯电高速续航 ${state.answers.evHighwayRange||'待填'} km`:null,
        state.answers.pet?'带宠物':null,
        state.stage>=2&&state.answers.ev===null?'车辆类型待选':null,
        state.stage>=2&&state.answers.pet===null?'宠物同行待选':null,
        located?(preview?`Codex 预览 · ${preview.totals.distanceSource}`:stats.source==='amap'?`${roadSnapshot.provider} · ${roadSnapshot.capturedAt}`:'路段为粗略估算，需 Codex 核验'):null
      ].filter(Boolean).map(item=>`<span>${esc(item)}</span>`).join('');
      return `<section class="panel global-state"><div class="global-state-head"><div><span class="kicker" style="color:#f3bd4d">全局状态</span><h3>${stageName}</h3><p>${preview?'优先展示 Codex 预览中核对过的数值':'只展示当前已经能够确定或计算的结果'}</p></div><span class="phase-chip">STEP ${state.stage} / 5</span></div><div class="global-state-grid">${cells}</div><div class="global-state-foot">${foot}</div></section>`;
    }

    function previewContent(){
      const preview=previewCurrent()?state.ai.preview:null;
      if(!preview) return `<section class="preview-sheet"><div class="preview-lead"><div><span class="kicker">04 · 路线预览</span><h2>先看清这条路，再做完整计划。</h2><p>Codex 会按你刚选定的所有地点重新核对路线、每日驾驶与游玩时间；尚未生成时不显示假精确数字。</p></div></div><div class="guide-next"><button class="ghost" type="button" data-stage="3">← 返回候选</button><button class="primary" type="button" data-action="ai-preview">让 Codex 生成预览 →</button></div></section>`;

        <div class="preview-route">${preview.routeOrder.map(esc).join(' → ')}</div>
        <div class="preview-metrics"><div><b>${n(total.distanceKm)}</b><span>全程公里 · ${esc(total.distanceSource)}</span></div><div><b>${Number.isFinite(total.driveHours)?`${n(total.driveHours)}h`:'待核验'}</b><span>驾驶时间</span></div><div><b>${Number.isFinite(total.chargeHours)?`${n(total.chargeHours)}h`:'待核验'}</b><span>预计补能</span></div><div><b>${n(total.playHours)}h</b><span>可用游玩 · ${esc(total.pressure)}</span></div></div>
        <div class="panel-head"><div><h3>每天大致怎么过</h3><p>按当前路线核对，完整计划会进一步展开到小时和具体地点。</p></div></div>
        <div class="preview-days">${preview.days.map(day=>`<article class="preview-day"><small>${esc(day.date)} · ${esc(day.route)}</small><h3>${esc(day.title)}</h3><p>${esc(day.activities)}</p><p>驾驶 ${n(day.driveHours)}h · 补能 ${n(day.chargeHours)}h · 游玩 ${n(day.playHours)}h · 里程 ${n(day.distanceKm)} km</p><p>住宿：${esc(day.lodging)}</p></article>`).join('')}</div>
        <div class="preview-notes"><h3>确认前看这里</h3><ul>${preview.notes.map(note=>`<li>${esc(note)}</li>`).join('')||'<li>暂无额外提醒。</li>'}</ul>${preview.sourceNotes.length?`<p>核验与估算：${preview.sourceNotes.map(esc).join('；')}</p>`:''}</div>
        <div class="guide-next"><button class="ghost" type="button" data-stage="3">← 返回候选调整</button>${mock?'<button class="primary" type="button" data-action="mock-final">预览模拟完整计划 →</button>':'<button class="primary" type="button" data-action="ai-plan">确认预览，生成完整计划 →</button>'}</div></section>`;
    }

    function refineEditor(){
      return state.ai.showRefine?`<section class="refine-panel" id="refinePanel"><h3>哪里还需要微调？</h3><p>写具体改动即可。已锁定的必去点、出行日期和硬约束不会因一句话被悄悄删掉；Codex 会在当前路书上修改。</p><textarea id="refineText" maxlength="2000" placeholder="例如：把柳州那天的驾驶拆开，东山岛留足两个完整的海边时段。">${esc(state.ai.refineDraft)}</textarea><div class="report-actions"><button type="button" class="primary" data-action="ai-refine" ${state.ai.status==='loading'?'disabled':''}>提交给 Codex 微调</button><button type="button" class="ghost" data-action="refine-close">取消</button></div></section>`:'';
    }

    function report(){
      if(state.ai.reportUrl) return `<section class="panel generated" id="reportPreview"><div class="report-hero"><span class="kicker" style="color:#f3bd4d">05 · 完整计划</span><h2>完整路书已经生成。</h2><p>这份报告由 Codex 在已确认预览基础上展开，并参考南线的章节与阅读顺序。</p><div class="report-actions"><a class="secondary" href="${esc(state.ai.reportUrl)}" target="_blank" rel="noopener">单独打开完整报告</a><button type="button" class="ghost" style="color:white;border-color:rgba(255,255,255,.25)" data-action="ai-plan">重新生成</button></div></div>${refineEditor()}<div class="ai-result-summary"><b>Codex 结论：</b>${esc(state.ai.summary||'已完成路线、逐日安排、住宿、宠物与纯电策略。')}</div><iframe class="ai-report-frame" src="${esc(state.ai.reportUrl)}" title="Codex 生成的完整自驾旅行计划"></iframe></section>`;
      const stats=routeStats(), days=schedule(), mock=state.ai.source==='mock';
      const overtime=days.filter(d=>d.drive>Number(state.answers.maxDrive));
      return `<section class="panel generated" id="reportPreview"><div class="report-hero"><span class="kicker" style="color:#f3bd4d">${mock?'模拟路书 · 未调用 CODEX':'FIXED ROADBOOK PREVIEW'}</span><h2>把必去点锁住，<br>把沿途选择权留给你。</h2><p>${routeNodes().map(n=>esc(n.name)).join(' → ')}。${mock?'本页只用于检查排版和交互，不能作为出行依据。':'计划只展示当前结论，不记录来回修改的过程。'}</p><div class="report-actions"><button type="button" class="secondary" data-action="download">下载独立 HTML</button><button type="button" class="ghost" style="color:white;border-color:rgba(255,255,255,.25)" data-action="print">打印 / PDF</button></div></div><div class="report-body">${metrics()}<div class="report-grid"><div><div class="panel-head"><div><span class="kicker">DAY BY DAY</span><h3>逐日时间轴与驾驶热度</h3><p>${mock?'以下日期、驾驶和游玩只是界面占位数据；未做路线核验。':'红色为驾驶，蓝色为有效游玩；数字由当前选择即时估算。'}</p></div></div><div class="day-list">${days.map((day,index)=>`<div class="day-row"><div class="day-date">D${index}<br>${day.date}</div><div class="day-title"><b>${esc(day.title)}</b><small>${esc(day.subtitle)}</small></div><div class="day-plan">${esc(day.plan)}<br><b>住宿：</b>${esc(day.stay)}</div><div class="day-bars"><div class="bar"><span>驾驶</span><div class="bar-track"><div class="bar-fill drive" style="width:${day.drive===null?0:Math.min(100,day.drive/10*100)}%"></div></div><b>${day.drive===null?'待核验':`${day.drive.toFixed(1)}h`}</b></div><div class="bar"><span>游玩</span><div class="bar-track"><div class="bar-fill play" style="width:${day.play===null?0:Math.min(100,day.play/9*100)}%"></div></div><b>${day.play===null?'待安排':`${day.play.toFixed(1)}h`}</b></div></div></div>`).join('')}</div></div><aside class="report-aside"><div class="report-block"><h3>这版计划的重点</h3><ul><li>${selectedCandidates().length} 个候选点已被你正式加入。</li><li>必去点始终锁定，不参与 AI 淘汰。</li><li>落脚休息采用区间，不伪装成旅游目的地。</li></ul></div><div class="report-block warning"><h3>需要处理的压力</h3><p>${overtime.length?`有 ${overtime.length} 个长转场超过 ${state.answers.maxDrive} 小时舒适值，正式规划时需拆成弹性休息区间。`:'没有转场超过当前舒适驾驶阈值。'}</p></div><div class="report-block"><h3>宠物与纯电</h3><p>${state.answers.pet?'景区、轮渡、跨境和住宿需逐项核验宠物规则；不把留车内作为默认方案。':'本次未启用宠物约束。'} ${state.answers.ev?'正式路线要把充电、排队和到站余量计入时长。':'本次未启用纯电约束。'}</p></div><div class="report-block"><h3>演示边界</h3><p>当前里程与时长是原型估算。生产版会接入地图、实时政策与预订数据，并显示来源与更新时间。</p></div></aside></div></div></section>`;
    }

    function guideContent(){
      if(state.stage===1) return `<div class="panel-head"><div><span class="kicker">基础行程</span><h2>先把地点和时间定下来。</h2><p>出发地、终点、必去点和日期齐了，才有判断沿途值得停哪里的依据。</p></div></div><div class="debug-notice"><span>${state.debugSample?'当前填的是调试示例，可直接修改地点与日期。':'当前为空白行程，可重新填入调试示例。'}</span><button type="button" data-action="toggle-debug">${state.debugSample?'清空示例':'填入示例'}</button></div>${routeEditor()}${timeEditor()}<div class="mock-controls"><p>调试页面：载入固定的示例路线和 6 个模拟候选，直接检查后续交互；不会调用 Codex，也不会保存当前输入。</p><button type="button" data-action="mock-candidates">载入模拟候选 →</button></div><div class="guide-next"><p>下一步再选节奏、驾驶上限与旅行偏好。</p><button class="primary" type="button" data-stage="2">继续：旅行偏好 →</button></div>`;
      if(state.stage===2) return `<div class="panel-head"><div><span class="kicker">旅行偏好</span><h2>哪些条件会改变路线？</h2><p>告诉 Codex 你的驾驶节奏、同行约束和想要的体验。</p></div></div>${questions()}<div style="margin-top:20px">${preferenceEditor()}</div><div class="mock-controls"><p>仅用于界面调试：载入固定示例路线及模拟候选，当前填写的条件会被替换。</p><button type="button" data-action="mock-candidates">载入模拟候选 →</button></div><div class="guide-next"><button class="ghost" type="button" data-stage="1">← 修改基础行程</button><button class="primary" type="button" data-action="ai-candidates" ${state.ai.status==='loading'?'disabled':''}>${state.ai.status==='loading'?'Codex 正在规划…':'让 Codex 生成沿途候选 →'}</button></div>`;
      if(state.stage===3){ const sorted=[...candidates].sort((a,b)=>candidateScore(b)-candidateScore(a)); const index=Math.max(0,Math.min(state.focusCandidate,sorted.length-1)); const c=sorted[index]; if(!c) return `<div class="panel-head"><div><h2>候选点还没生成。</h2><p>完成前两步后，让 Codex 根据你的真实路线生成沿途选择。</p></div></div><button class="primary" type="button" data-action="ai-candidates">生成沿途候选 →</button>`; return `<div class="panel-head"><div><span class="kicker">ONE DECISION AT A TIME</span><h2>这个地方，值不值得拐进去？</h2><p>${state.ai.source==='mock'?'以下是固定模拟数据，只用于检查页面，不代表 Codex 的规划结论。':'这些候选来自当前 Codex 会话的规划结果。'}</p></div><button class="ghost" type="button" data-action="ai-candidates">重新问 Codex</button></div><div class="guide-candidate-focus"><button class="focus-arrow" data-action="focus-prev" aria-label="上一个候选"><span aria-hidden="true">←</span><span class="arrow-label">上一个</span></button>${candidateCard(c,true)}<button class="focus-arrow" data-action="focus-next" aria-label="下一个候选"><span class="arrow-label">下一个</span><span aria-hidden="true">→</span></button></div><div class="focus-count">${index+1} / ${sorted.length} · 按推荐度排序</div>${state.ai.source==='mock'?'<div class="mock-controls"><p>候选选好后先看模拟预览；不会调用 Codex。</p><button type="button" data-action="mock-preview">查看模拟预览 →</button></div>':''}<div class="guide-next"><button class="ghost" type="button" data-stage="2">← 修改条件</button><button class="primary" type="button" data-action="ai-preview" ${state.ai.status==='loading'?'disabled':''}>${state.ai.status==='loading'?'Codex 正在生成…':'候选选好了，生成预览 →'}</button></div>`; }
      if(state.stage===4) return previewContent();
      return report();
    }

    function guideVariant(){
      return `<div class="guide"><div class="guide-shell"><section class="guide-hero"><div><span class="kicker" style="color:#f3bd4d">先把路线搭起来</span><h1>先定下非去不可，<br>再挑沿途值得停。</h1><p>把一定要去的地方先放进路线，再看看沿途哪些地方值得多留一晚。每加一站，都把能玩什么、要多开多久、建议留几天说清楚。</p></div></section>${routeOrderBand()}<div class="guide-body"><main class="panel guide-main">${guideContent()}</main><aside class="guide-side"><div class="guide-map-label"><div><span class="kicker">路线预览</span><b>随选择实时更新</b></div><small>${state.stage<3?'当前只显示必去骨架':'候选加入后立即改线'}</small></div>${mapView()}${globalDashboard()}</aside></div></div></div>`;

    function render(){
      invalidateStaleReview();
      app.innerHTML = header() + guideVariant();
      refreshMapPreview();
    }

    function toast(message){ clearTimeout(toastTimer); toastEl.textContent=message; toastEl.classList.add('is-show'); toastTimer=setTimeout(()=>toastEl.classList.remove('is-show'),2600); }

    function plannerState(){
      return {
        route: JSON.parse(JSON.stringify(state.route)),
        preferences: JSON.parse(JSON.stringify(state.prefs)),
        answers: JSON.parse(JSON.stringify(state.answers)),
        candidates: candidates.map(candidate=>({ ...candidate, status:statusOf(candidate.id) })),
        routeOrder: routeNodes().map(node=>node.name),
        clientEstimate: planningReady()?routeStats():null,
        review: { preview:previewCurrent()?state.ai.preview:null, mock:state.ai.source==='mock' }
      };
    }

    function setAiState(status,message){
      state.ai.status=status;
      state.ai.message=message;
      render();
    }

    async function checkCodexStatus(){
      if(location.protocol==='file:'){
        state.ai={...state.ai,status:'error',backendReady:false,message:'当前是 file:// 静态页。请让 Codex 启动本地页面并保持等待。'};
        render();
        return;
      }
      try{
        const response=await fetch('/api/status',{cache:'no-store'});
        const data=await response.json();
        const ready=data.mode==='current-codex-thread'&&Boolean(data.runnerConnected);
        const changed=state.ai.backendReady!==ready||state.ai.status==='checking';
        state.ai.backendReady=ready;
        if(!state.ai.ended&&state.ai.status!=='loading'&&state.ai.source!=='mock'&&changed){
          state.ai.status=ready?'idle':'error';
          state.ai.message=ready?'当前 Codex 会话正在等待操作；点击生成后，请在 Codex 对话中查看规划过程。':'当前 Codex 会话尚未进入等待状态，请回到 Codex 对话。';
        }
        if(changed) render();
      }catch(error){
        if(state.ai.source==='mock') return;
        state.ai={...state.ai,status:'error',backendReady:false,message:`无法连接本地规划服务：${error.message}`};
        render();
      }
    }

    async function waitForJob(jobId){
      while(true){
        const response=await fetch(`/api/jobs/${encodeURIComponent(jobId)}`,{cache:'no-store'});
        const data=await response.json();
        if(!response.ok||!data.ok) throw new Error(data.error||'无法读取任务进度');
        const job=data.job;
        if(job.status==='completed') return job.result;
        if(job.status==='failed') throw new Error(job.error||'Codex 未能完成任务');
        if(job.message&&job.message!==state.ai.message) setAiState('loading',job.message);
        await new Promise(resolve=>setTimeout(resolve,1500));
      }
    }

    function applyCodexCandidates(data,source='codex'){
      const incoming=Array.isArray(data.candidates)?data.candidates:[];
      if(!incoming.length) throw new Error('Codex 没有返回候选地点。');
      candidates=incoming.map((candidate,index)=>({
        ...candidate,
        id:String(candidate.id||`candidate-${index+1}`).toLowerCase().replace(/[^a-z0-9-]+/g,'-'),
        order:Number(candidate.order)||index+1,
        detour:Number(candidate.detour)||0,
        drive:Number(candidate.drive)||0,
        stay:Number(candidate.stay)||1,
        tags:Array.isArray(candidate.tags)?[...new Set(candidate.tags.filter(tag=>preferenceKeys.includes(tag)))]:[]
      }));
      state.candidateStatus={};
      candidates.forEach(candidate=>{
        state.candidateStatus[candidate.id]='none';
        cityCatalog[candidate.name]={
          lon:Number(candidate.lon),lat:Number(candidate.lat),stay:candidate.stay,
          highlight:candidate.highlight||candidate.reason,tags:candidate.tags
        };
      });
      state.focusCandidate=0;
      state.stage=3;
      state.ai.source=source;
      state.ai.summary=data.summary||'';
      state.ai.preview=null;state.ai.previewKey='';state.ai.reportUrl='';state.ai.showRefine=false;
    }

    function loadMockCandidates(){
      if(state.ai.status==='loading') return;
      state.route=structuredClone(debugExample.route);
      state.answers={...debugExample.answers};
      state.prefs={...emptyPrefs(),...debugExample.prefs};
      state.debugSample=true;
      applyCodexCandidates(mockCandidateResult,'mock');
      state.ai.status='idle';
      state.ai.message='模拟候选已载入；没有调用 Codex。';
      render();
      toast('已载入 6 个模拟候选，可直接测试左右切换与选择。');
    }

    function previewMockPlan(){
      if(state.ai.source!=='mock') return;
      const stats=routeStats();
      state.ai.preview={status:'completed',summary:'固定示例，只用于检查预览排版。路线、里程、日期和宠物规则均未由 Codex 核验。',routeOrder:routeNodes().map(n=>n.name),
        totals:{distanceKm:stats.km,driveHours:null,chargeHours:null,playHours:stats.play,pressure:'待核验',distanceSource:'模拟示例'},
        days:schedule().map(day=>({date:day.date,title:day.title,route:day.title,distanceKm:null,driveHours:day.drive,chargeHours:null,playHours:day.play,activities:day.plan,lodging:day.stay})),
        notes:['这是调试用的模拟预览，不代表实际的道路、充电或游玩安排。'],sourceNotes:['无实时路线核验']};
      state.ai.previewKey=reviewKey();
      state.ai.status='idle';
      state.ai.message='正在显示模拟路线预览；没有调用 Codex。';
      state.stage=4;
      render();
    }

    function mockFinalPlan(){
      if(state.ai.source!=='mock'||!previewCurrent()) return;
      state.stage=5;render();
    }

    async function requestCodexCandidates(){
      if(!frameworkReady()){
        state.stage=1;render();toast('先完成第一步的地点与时间。');return;
      }
      if(!planningReady()){
        state.stage=2;render();toast('请补齐驾驶、绕路、宠物与车辆条件；纯电车还需填写高速实际续航。');return;
      }
      if(!state.ai.backendReady){toast('当前 Codex 会话尚未等待页面操作，请回到 Codex 对话。');return;}
      setAiState('loading','请求已提交；当前 Codex 会话将领取任务，过程会显示在 Codex 对话中。');
      try{
        const response=await fetch('/api/codex/candidates',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(plannerState())});
        const data=await response.json();
        if(!response.ok||!data.ok) throw new Error(data.error||'候选生成失败');
        const result=await waitForJob(data.job.id);
        applyCodexCandidates(result);
        state.ai.status='idle';
        state.ai.message=`Codex 已返回 ${candidates.length} 个候选。选好之后，第 4 步会单独生成路线预览。`;
        render();
      }catch(error){
        state.ai.status='error';state.ai.message=`Codex 候选生成失败：${error.message}`;render();
      }
    }

    async function requestCodexPreview(){
      if(!frameworkReady()){
        state.stage=1;render();toast('先完成第一步的地点与时间。');return;
      }
      if(!planningReady()){
        state.stage=2;render();toast('先填写完整的必要信息。');return;
      }
      if(!candidates.length){state.stage=3;render();toast('先生成并审阅沿途候选。');return;}
      if(!state.ai.backendReady){toast('当前 Codex 会话尚未等待页面操作，请回到 Codex 对话。');return;}
      const submittedKey=reviewKey();
      setAiState('loading','Codex 正在重新核对所选路线、时间、补能和游玩安排；过程可在对话中查看。');
      try{
        const response=await fetch('/api/codex/preview',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(plannerState())});
        const data=await response.json();
        if(!response.ok||!data.ok) throw new Error(data.error||'路线预览生成失败');
        const result=await waitForJob(data.job.id);
        if(reviewKey()!==submittedKey){state.ai.status='idle';render();toast('生成期间路线条件有变化，请重新生成预览。');return;}
        state.ai.preview=result;state.ai.previewKey=submittedKey;state.ai.reportUrl='';state.stage=4;
        state.ai.status='idle';
        state.ai.message='Codex 已完成路线预览。请核对每日安排，再决定是否生成完整计划。';
        render();
      }catch(error){
        state.ai.status='error';state.ai.message=`Codex 预览生成失败：${error.message}`;render();
      }
    }

    async function requestCodexPlan(){
      if(!previewCurrent()){state.stage=3;render();toast('先让 Codex 生成并确认当前路线的预览。');return;}
      if(state.ai.source==='mock'){toast('模拟数据不能生成真实路书，请先让 Codex 生成候选和预览。');return;}
      if(!state.ai.backendReady){toast('当前 Codex 会话尚未等待页面操作，请回到 Codex 对话。');return;}
      setAiState('loading','Codex 正在根据已确认预览，按南线模板生成完整路书。');
      try{
        const response=await fetch('/api/codex/plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(plannerState())});
        const data=await response.json();
        if(!response.ok||!data.ok) throw new Error(data.error||'完整计划生成失败');
        const result=await waitForJob(data.job.id);
        state.ai.status='idle';state.ai.message='完整计划已生成；右上角可提交文字微调。';
        state.ai.summary=result.summary||'';state.ai.reportUrl=result.reportUrl||'/generated-plan';state.stage=5;
        render();
        setTimeout(()=>document.getElementById('reportPreview')?.scrollIntoView({behavior:'smooth',block:'start'}),0);
      }catch(error){state.ai.status='error';state.ai.message=`Codex 完整计划生成失败：${error.message}`;render();}
    }

    async function requestCodexRefine(){
      const instruction=document.getElementById('refineText')?.value.trim()||state.ai.refineDraft.trim();
      state.ai.refineDraft=instruction;
      if(!instruction){toast('写下你希望调整的具体内容。');return;}
      if(!state.ai.reportUrl||!previewCurrent()){toast('先生成完整计划。');return;}
      if(!state.ai.backendReady){toast('当前 Codex 会话尚未等待页面操作，请回到 Codex 对话。');return;}
      setAiState('loading','Codex 正在根据你的文字要求微调现有报告；原报告会保留到新版完成。');
      try{
        const response=await fetch('/api/codex/refine',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...plannerState(),instruction})});
        const data=await response.json();
        if(!response.ok||!data.ok) throw new Error(data.error||'微调未能提交');
        const result=await waitForJob(data.job.id);
        state.ai.status='idle';state.ai.message='微调完成，已替换为新版完整计划。';
        state.ai.summary=result.summary||state.ai.summary;state.ai.reportUrl=result.reportUrl||state.ai.reportUrl;
        state.ai.refineDraft='';state.ai.showRefine=false;state.stage=5;render();
      }catch(error){state.ai.status='error';state.ai.message=`微调失败，原报告仍可查看：${error.message}`;render();}
    }

    async function endSession(){
      if(state.ai.status==='loading') return;
      try{
        const response=await fetch('/api/bridge/stop',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
        const data=await response.json();
        if(!response.ok||!data.ok) throw new Error(data.error||'结束请求失败');
        state.ai.ended=true;
        state.ai.status='ended';
        state.ai.message='已通知当前 Codex 会话结束等待；已生成的路书仍可在本页查看。';
        render();
      }catch(error){toast(error.message);}
    }

    async function registerPlannerTools(){
      if(state.webMcpRegistered||typeof document.modelContext?.registerTool!=='function') return;
      state.webMcpRegistered=true;
      await document.modelContext.registerTool({
        name:'roadtrip_get_state',
        description:'Read the current road-trip planner state, including hard stops, dates, preferences, candidates, and candidate decisions.',
        inputSchema:{type:'object',properties:{},additionalProperties:false},
        annotations:{readOnlyHint:true},
        execute:async()=>plannerState()
      });
      await document.modelContext.registerTool({
        name:'roadtrip_generate_candidates',
        description:'Submit the current planner state to the active Codex conversation for route-aware optional stops.',
        inputSchema:{type:'object',properties:{},additionalProperties:false},
        annotations:{readOnlyHint:false,openWorldHint:true},
        execute:async()=>{await requestCodexCandidates();return {status:state.ai.status,summary:state.ai.summary,candidateCount:candidates.length};}
      });
      await document.modelContext.registerTool({
        name:'roadtrip_generate_preview',
        description:'Submit the reviewed stops to the active Codex conversation for a route and schedule preview before the full report.',
        inputSchema:{type:'object',properties:{},additionalProperties:false},
        annotations:{readOnlyHint:false,openWorldHint:true},
        execute:async()=>{await requestCodexPreview();return {status:state.ai.status,preview:state.ai.preview};}
      });
      await document.modelContext.registerTool({
        name:'roadtrip_generate_report',
        description:'Submit the confirmed preview to the active Codex conversation for a full HTML roadbook.',
        inputSchema:{type:'object',properties:{},additionalProperties:false},
        annotations:{readOnlyHint:false,openWorldHint:true},
        execute:async()=>{await requestCodexPlan();return {status:state.ai.status,reportUrl:state.ai.reportUrl,summary:state.ai.summary};}
      });
    }

    function showState(){ state.stage=1; toast('已确认条件显示在右侧深绿色卡片中。'); render(); }

    function goToStage(nextStage){
      if(nextStage >= 2 && !frameworkReady()){
        state.stage=1;
        render();
        toast('先选出发地、终点、至少一个必去点，并填好出发与结束时间。');
        return false;
      }
      if(nextStage >= 3 && !planningReady()){
        state.stage=2;
        render();
        toast('请补齐驾驶、绕路、宠物与车辆条件；纯电车还需填写高速实际续航。');
        return false;
      }
      if(nextStage===5&&!state.ai.reportUrl){toast('先核对第 4 步预览，再生成完整计划。');return false;}
      state.stage=nextStage;
      render();
      return true;
    }

    function addStop(){
      const input=document.getElementById('newMustStop'); const name=input?.value.trim();
      if(!name) return toast('先输入一个必去点。');
      if([state.route.start,...state.route.must,state.route.end].includes(name)) return toast('这个地点已经在路线中。');
      state.route.must.push(name); state.stage=1; render(); toast(`${name} 已锁定为必去点。`);
    }

    function toggleDebugExample(){
      state.debugSample=!state.debugSample;
      state.route=state.debugSample?structuredClone(debugExample.route):emptyRoute();
      state.answers=state.debugSample?{...debugExample.answers}:emptyAnswers();
      state.prefs={...emptyPrefs(),...(state.debugSample?debugExample.prefs:{})};
      state.candidateStatus={};candidates=[];state.focusCandidate=0;state.stage=1;
      state.ai.source='static';state.ai.summary='';state.ai.preview=null;state.ai.previewKey='';state.ai.reportUrl='';state.ai.showRefine=false;
      render();
      toast(state.debugSample?'调试示例已填入。':'示例已清空。');
    }

    function matchingPlaces(query){
      const q=query.trim().toLocaleLowerCase();
      if(!q) return [];
      return locations.map((place,index)=>({place,index})).filter(({place})=>place[1].toLocaleLowerCase().includes(q)||place[4].toLocaleLowerCase().includes(q)||place[0].includes(q)).sort((a,b)=>{
        const score=({place})=>place[1]===query?0:place[1].startsWith(query)?1:place[5]===2?2:place[5]===3?3:4;
        return score(a)-score(b)||a.place[4].length-b.place[4].length;
      }).slice(0,8);
    }

    function showPlaceResults(input){
      const list=input.parentElement.querySelector('.place-results');
      const matches=matchingPlaces(input.value);
      list.innerHTML=matches.length?matches.map(({place,index})=>`<button type="button" class="place-option" role="option" data-place-option="${index}"><b>${esc(place[1])}</b><small>${esc([place[2],place[3]].filter((item,i,items)=>item&&item!==place[1]&&items.indexOf(item)===i).join(' · ')||'省级地区')}</small></button>`).join(''):`<div class="place-empty">未找到行政区划。${input.dataset.placeField==='must'?'可直接把景点或海岛加入必去点。':'可继续输入具体地点。'}</div>`;
      list.hidden=!input.value.trim();
      input.setAttribute('aria-expanded',String(!list.hidden));
    }

    function choosePlace(input,index){
      const place=locations[index];
      if(!place) return;
      input.value=place[4];
      if(input.dataset.placeField!=='must'){
        state.route[input.dataset.placeField]=place[4];
        render();
      }else{
        input.parentElement.querySelector('.place-results').hidden=true;
        input.setAttribute('aria-expanded','false');
        input.focus();
      }
    }

    function commitPlaceText(input){
      if(input.dataset.placeField==='must') return;
      const value=input.value.trim();
      if(state.route[input.dataset.placeField]!==value){
        state.route[input.dataset.placeField]=value;
        render();
      }
    }

    function updateCandidate(id,nextStatus){
      const current=statusOf(id); state.candidateStatus[id]=current===nextStatus?'none':nextStatus; state.stage=3; render();
      const candidate=candidates.find(c=>c.id===id); const label=state.candidateStatus[id]==='selected'?'已加入路线':state.candidateStatus[id]==='excluded'?'已排除':'已恢复待决定'; toast(`${candidate.name}${label}。`);
    }

    function downloadReport(){
      const blob=new Blob([standaloneReport()],{type:'text/html;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='我的自驾旅行计划.html'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast('已生成可独立打开的 HTML 路书。');

    document.addEventListener('pointerdown',event=>{
      const option=event.target.closest('[data-place-option]');
      if(!option) return;

    document.addEventListener('click',event=>{
      const stageButton=event.target.closest('[data-stage]'); if(stageButton){goToStage(Number(stageButton.dataset.stage));return;}
      const prefButton=event.target.closest('[data-pref]'); if(prefButton){const key=prefButton.dataset.pref;const index=preferenceCycles.indexOf(state.prefs[key]||'off');state.prefs[key]=preferenceCycles[(index+1)%preferenceCycles.length];render();return;}
      const filterButton=event.target.closest('[data-filter]'); if(filterButton){const key=filterButton.dataset.filter;state.answers[key]=!state.answers[key];render();return;}
      const toggle=event.target.closest('[data-toggle]'); if(toggle){const key=toggle.dataset.toggle;state.answers[key]=state.answers[key]===null?true:state.answers[key]===true?false:null;if(key==='ev'&&state.answers.ev!==true)state.answers.evHighwayRange='';render();return;}
      const candidateButton=event.target.closest('[data-candidate]'); if(candidateButton){updateCandidate(candidateButton.dataset.candidate,candidateButton.dataset.statusChoice);return;}
      const action=event.target.closest('[data-action]')?.dataset.action;
      if(action==='toggle-debug'){toggleDebugExample();return;}

      if(action==='add-stop'){addStop();return;}

      if(action==='move-stop'){const el=event.target.closest('[data-index]');const index=Number(el.dataset.index),next=index+Number(el.dataset.dir);if(next>=0&&next<state.route.must.length){[state.route.must[index],state.route.must[next]]=[state.route.must[next],state.route.must[index]];render();}return;}
      if(action==='generate'||action==='ai-plan'){requestCodexPlan();return;}
      if(action==='ai-preview'){requestCodexPreview();return;}
      if(action==='ai-refine'){requestCodexRefine();return;}
      if(action==='refine-open'){state.ai.showRefine=true;render();document.getElementById('refinePanel')?.scrollIntoView({behavior:'smooth',block:'center'});return;}
      if(action==='refine-close'){state.ai.showRefine=false;render();return;}
      if(action==='open-report'){if(state.ai.reportUrl)window.open(state.ai.reportUrl,'_blank','noopener');else toast('请先生成完整计划。');return;}
      if(action==='ai-candidates'){requestCodexCandidates();return;}

      if(action==='print'){window.print();return;}
    });

    document.addEventListener('change',event=>{
      if(event.target.matches('[data-place-field]')){commitPlaceText(event.target);return;}
      if(event.target.matches('[data-answer]')){state.answers[event.target.dataset.answer]=event.target.value;render();}
    });

    document.addEventListener('input',event=>{
      if(event.target.matches('[data-place-field]')) showPlaceResults(event.target);
      if(event.target.id==='refineText') state.ai.refineDraft=event.target.value;
    });

    document.addEventListener('focusout',event=>{
      if(!event.target.matches('[data-place-field]')) return;
      setTimeout(()=>{const list=event.target.parentElement?.querySelector('.place-results');if(list){list.hidden=true;event.target.setAttribute('aria-expanded','false');}},100);
    });

    document.addEventListener('keydown',event=>{
      if(!event.target?.matches('[data-place-field]')) return;
      const input=event.target,list=input.parentElement.querySelector('.place-results');
      if(event.key==='ArrowDown'||event.key==='ArrowUp'){
        event.preventDefault();
        if(list.hidden) showPlaceResults(input);
        const options=[...list.querySelectorAll('[data-place-option]')];
        if(!options.length) return;
        const active=options.findIndex(option=>option.classList.contains('is-active'));
        const next=active<0?(event.key==='ArrowDown'?0:options.length-1):(active+(event.key==='ArrowDown'?1:-1)+options.length)%options.length;
        options.forEach((option,index)=>option.classList.toggle('is-active',index===next));
        options[next]?.scrollIntoView({block:'nearest'});
      }
      if(event.key==='Enter'){
        const options=[...list.querySelectorAll('[data-place-option]')];
        const active=options.findIndex(option=>option.classList.contains('is-active'));
        if(!list.hidden&&options.length){event.preventDefault();choosePlace(input,Number(options[Math.max(0,active)].dataset.placeOption));}
        else if(input.dataset.placeField==='must'){event.preventDefault();addStop();}
        else{event.preventDefault();commitPlaceText(input);}
      }
      if(event.key==='Escape'){list.hidden=true;input.setAttribute('aria-expanded','false');}
    });

    render();
    checkCodexStatus();
    if(location.protocol!=='file:') setInterval(checkCodexStatus,5000);
    registerPlannerTools().catch(()=>{});
  </script>
</body>
</html>
