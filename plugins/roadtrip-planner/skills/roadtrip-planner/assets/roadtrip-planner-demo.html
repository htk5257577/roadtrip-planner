<!doctype html>
<!-- Three variants of a road-trip planning workspace, switchable via ?variant=, in one portable prototype. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#122f2b">
  <title>路书工坊 · Codex 自驾规划器</title>
  <style>
    :root{
      --paper:#f4eddf;--paper-2:#e8dec9;--ink:#183b36;--muted:#6e7c75;
      --pine:#123f37;--pine-2:#0d2d29;--red:#e65c3d;--red-dark:#b73d2a;
      --sun:#f3bd4d;--sky:#8ab9be;--blue:#236d78;--white:#fffdf6;
      --line:rgba(24,59,54,.15);--shadow:0 18px 50px rgba(19,43,38,.13);
      --radius:22px;--sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      --serif:"Songti SC","STSong","Noto Serif CJK SC",serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);background:
      radial-gradient(circle at 8% 0,rgba(243,189,77,.22),transparent 30rem),
      repeating-linear-gradient(0deg,rgba(24,59,54,.025) 0,rgba(24,59,54,.025) 1px,transparent 1px,transparent 5px),var(--paper)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(35,109,120,.26);outline-offset:2px}
    .app{min-height:100vh;padding-bottom:96px}
    .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 22px;color:#fff;background:rgba(13,45,41,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.1)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;color:var(--pine-2);background:var(--sun);font:900 18px Georgia,serif;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
    .brand-copy{min-width:0}.brand-copy b{display:block;font-family:var(--serif);font-size:18px}.brand-copy span{display:block;margin-top:2px;color:#bcd0ca;font-size:10px;letter-spacing:.08em}
    .top-actions{display:flex;align-items:center;gap:8px}
    .prototype-badge{padding:7px 10px;border:1px solid rgba(255,255,255,.18);border-radius:99px;color:#dce7e1;font-size:10px;font-weight:800}
    .session-end{border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:9px 11px;color:#d7e7e1;background:transparent;font-size:10px;font-weight:800}
    .session-end:hover{background:rgba(255,255,255,.1)}
    .primary,.secondary,.ghost,.danger,.status-btn{border:0;border-radius:12px;padding:10px 14px;font-weight:900}
    .primary{color:white;background:var(--red);box-shadow:0 7px 18px rgba(230,92,61,.22)}
    .primary:hover{background:var(--red-dark)}
    .secondary{color:var(--ink);background:var(--sun)}
    .ghost{color:var(--ink);background:transparent;border:1px solid var(--line)}
    .ghost:hover{background:rgba(24,59,54,.06)}
    .danger{color:var(--red-dark);background:#f8dfd7}
    .stagebar{display:flex;align-items:center;gap:7px;padding:12px 22px;overflow:auto;background:rgba(255,253,246,.82);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);scrollbar-width:none}
    .stage{display:flex;align-items:center;gap:7px;white-space:nowrap;border:0;padding:8px 12px;border-radius:99px;color:var(--muted);background:transparent;font-size:12px;font-weight:800}
    .stage i{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;font:900 11px Georgia,serif;background:var(--paper-2);font-style:normal}
    .stage.is-active{color:var(--ink);background:#fff;border:1px solid var(--line);box-shadow:0 5px 15px rgba(24,59,54,.06)}
    .stage.is-active i{color:white;background:var(--red)}
    .stage-divider{width:18px;height:1px;background:var(--line);flex:0 0 auto}
    .panel{min-width:0;background:rgba(255,253,246,.88);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 30px rgba(24,59,54,.06)}
    .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}
    .panel-head h2,.panel-head h3{margin:0;font-family:var(--serif)}
    .panel-head h2{font-size:24px}.panel-head h3{font-size:19px}
    .panel-head p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.55}
    .kicker{display:block;margin-bottom:5px;color:var(--red);font-size:9px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
    .route-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .field{display:grid;gap:5px}.field span{color:var(--muted);font-size:10px;font-weight:800}
    .field input,.field select,.add-row input{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;color:var(--ink);background:#fffdf8}
    .must-list{display:grid;gap:7px;margin:10px 0}
    .must-stop{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 9px;border-radius:12px;background:#fff;border:1px solid rgba(230,92,61,.2)}
    .must-stop .lock{display:grid;place-items:center;width:27px;height:27px;border-radius:9px;color:white;background:var(--red);font-size:12px}
    .must-stop b{font-size:12px}.must-stop small{display:block;margin-top:2px;color:var(--muted);font-size:9px}
    .must-actions{display:flex;gap:3px}.mini{display:grid;place-items:center;width:26px;height:26px;border:0;border-radius:8px;color:var(--muted);background:var(--paper)}
    .mini:hover{color:var(--ink);background:var(--paper-2)}
    .add-row{display:grid;grid-template-columns:1fr auto;gap:7px}
    .helper{margin:8px 0 0;color:var(--muted);font-size:9px;line-height:1.55}
    .pref-grid{display:flex;flex-wrap:wrap;gap:7px}
    .pref{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:7px 9px;color:var(--muted);background:#fffdf8;font-size:10px;font-weight:800}
    .pref:after{content:attr(data-state-label);padding:2px 5px;border-radius:99px;background:var(--paper-2);font-size:8px}
    .pref[data-state="prefer"]{color:var(--blue);border-color:rgba(35,109,120,.3);background:#eaf3f2}.pref[data-state="prefer"]:after{background:#cfe5e4}
    .pref[data-state="must"]{color:var(--red-dark);border-color:rgba(230,92,61,.35);background:#fff0e9}.pref[data-state="must"]:after{color:white;background:var(--red)}
    .pref[data-state="avoid"]{color:#6f6462;text-decoration:line-through;background:#eee9e3}.pref[data-state="avoid"]:after{color:white;background:#756c68;text-decoration:none}
    .question-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .question{padding:10px;border-radius:13px;background:var(--paper);border:1px solid rgba(24,59,54,.08)}
    .question label{display:block;margin-bottom:7px;font-size:10px;font-weight:900}.question select,.question input{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff}
    .toggle{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;padding:8px 0;color:var(--ink);background:transparent;font-size:11px;font-weight:800;text-align:left}
    .toggle i{position:relative;width:34px;height:20px;border-radius:99px;background:#c7c7c0;font-style:normal;transition:.2s}.toggle i:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:white;transition:.2s}
    .toggle.is-on i{background:var(--pine)}.toggle.is-on i:after{transform:translateX(14px)}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .metric{padding:11px;border-radius:13px;background:rgba(255,253,246,.82);border:1px solid var(--line)}
    .metric b{display:block;font:900 19px/1 Georgia,serif;color:var(--red)}.metric b.is-pending{color:var(--muted);font:900 13px/1.15 var(--sans)}.metric span{display:block;margin-top:5px;color:var(--muted);font-size:8px;line-height:1.35}
    .map-card{position:relative;overflow:hidden;min-height:460px;background:linear-gradient(155deg,#d8e8dd 0%,#f3e7cb 56%,#c9d9d9 100%)}
    .map-card:before{content:"";position:absolute;inset:0;opacity:.3;background-image:radial-gradient(circle at 30% 40%,transparent 0 17%,rgba(24,59,54,.18) 17.3% 17.6%,transparent 18%),radial-gradient(circle at 68% 56%,transparent 0 24%,rgba(24,59,54,.16) 24.3% 24.7%,transparent 25%)}
    .map-card svg{position:relative;display:block;width:100%;height:460px}
    .map-overlay{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:end;justify-content:space-between;gap:10px;pointer-events:none}
    .map-legend{max-width:68%;padding:10px 12px;border:1px solid rgba(255,255,255,.55);border-radius:14px;background:rgba(255,253,246,.84);backdrop-filter:blur(10px);font-size:9px;line-height:1.6;box-shadow:0 9px 24px rgba(24,59,54,.1)}
    .legend-row{display:flex;gap:9px;flex-wrap:wrap}.legend-row span{display:flex;align-items:center;gap:4px}.dot{width:8px;height:8px;border-radius:50%}.dot.locked{background:var(--red)}.dot.selected{background:var(--pine)}.dot.optional{border:2px solid var(--blue);background:white}
    .map-mode{padding:9px 11px;border-radius:12px;color:#fff;background:var(--pine);font-size:9px;font-weight:900}
    .route-string{display:flex;align-items:center;gap:6px;padding:12px 0 3px;overflow:auto;scrollbar-width:none}
    .route-node{flex:0 0 auto;padding:7px 9px;border-radius:99px;font-size:9px;font-weight:900;border:1px solid var(--line);background:#fff}.route-node.hard{color:var(--red-dark);border-color:rgba(230,92,61,.28)}.route-node.soft{color:white;background:var(--pine);border-color:var(--pine)}
    .route-arrow{color:#a69b89;font-size:10px}
    .candidate-list{display:grid;gap:10px}
    .candidate{position:relative;padding:14px;border-radius:17px;border:1px solid var(--line);background:#fffdf8;overflow:hidden}
    .candidate[data-status="selected"]{border-color:rgba(18,63,55,.42);box-shadow:inset 4px 0 0 var(--pine)}
    .candidate[data-status="backup"]{border-color:rgba(243,189,77,.65);box-shadow:inset 4px 0 0 var(--sun)}
    .candidate[data-status="excluded"]{opacity:.58;filter:grayscale(.4)}
    .candidate-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.candidate-title h3{margin:0;font-family:var(--serif);font-size:18px}.candidate-title small{display:block;margin-top:4px;color:var(--muted);font-size:9px}
    .score{display:grid;place-items:center;min-width:45px;height:45px;border-radius:50%;color:white;background:var(--pine);font:900 14px Georgia,serif}.score small{font:700 7px var(--sans)}
    .candidate-reason{margin:10px 0;color:var(--ink);font-size:10px;line-height:1.6}
    .candidate-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.fact{padding:7px;border-radius:9px;background:var(--paper);font-size:8px;color:var(--muted)}.fact b{display:block;margin-bottom:2px;color:var(--ink);font-size:10px}
    .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.tag{padding:4px 6px;border-radius:99px;color:var(--blue);background:#e9f2f1;font-size:8px;font-weight:800}
    .candidate-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}.status-btn{padding:8px 6px;color:var(--muted);background:var(--paper);font-size:9px}.status-btn.is-active[data-status-choice="selected"]{color:white;background:var(--pine)}.status-btn.is-active[data-status-choice="backup"]{color:var(--ink);background:var(--sun)}.status-btn.is-active[data-status-choice="excluded"]{color:white;background:#7a706c}
    .state-summary{padding:14px;border-radius:16px;color:#eaf2ed;background:var(--pine-2)}
    .state-summary h3{margin:0 0 9px;color:var(--sun);font-family:var(--serif);font-size:16px}.state-summary dl{display:grid;grid-template-columns:60px 1fr;gap:7px 9px;margin:0;font-size:9px;line-height:1.55}.state-summary dt{color:#89aaa0}.state-summary dd{margin:0}
    .ai-note{padding:12px;border-radius:14px;background:#fff0d2;border:1px solid rgba(243,189,77,.4);font-size:9px;line-height:1.65}.ai-note b{color:var(--red-dark)}
    .empty{display:grid;place-items:center;min-height:220px;padding:30px;text-align:center;color:var(--muted)}
    .empty b{display:block;margin-bottom:7px;color:var(--ink);font-family:var(--serif);font-size:20px}
    .ai-run-state{display:flex;align-items:center;justify-content:center;gap:8px;min-height:34px;padding:7px 18px;color:#cfe1da;background:#17483f;border-bottom:1px solid rgba(255,255,255,.08);font-size:10px;font-weight:800;text-align:center}
    .ai-run-state[data-status="loading"]{color:#172f2b;background:var(--sun)}.ai-run-state[data-status="error"]{color:white;background:var(--red-dark)}.ai-run-state[data-status="ready"]{color:#d7eee6;background:#176153}.ai-run-state[data-status="ended"]{color:#d7eee6;background:#33524b}
    .ai-pulse{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 1.4s infinite}.ai-run-state:not([data-status="loading"]) .ai-pulse{animation:none}
    .ai-report-frame{display:block;width:100%;height:76vh;min-height:680px;border:0;background:white}.ai-result-summary{padding:16px 20px;color:var(--ink);background:#fff0d2;border-bottom:1px solid var(--line);font-size:11px;line-height:1.65}.ai-result-summary b{color:var(--red-dark)}
    button:disabled{cursor:wait;opacity:.58}
    @keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

    /* Variant A: cartographic command desk */
    .atlas{padding:18px}.atlas-grid{display:grid;grid-template-columns:300px minmax(430px,1fr) 350px;gap:14px;max-width:1680px;margin:auto}.atlas-left,.atlas-right{display:grid;align-content:start;gap:12px}.atlas-left,.atlas-center,.atlas-right{min-width:0}.atlas-left>.panel,.atlas-right>.panel{padding:15px}.atlas-center{display:grid;align-content:start;gap:12px}.atlas-center>.panel:not(.map-card){padding:14px}.atlas .candidate-list{max-height:690px;overflow:auto;padding-right:3px}

    /* Variant B: guided interview */
    .guide-shell{width:min(1180px,calc(100% - 28px));margin:28px auto}.guide-hero{position:relative;overflow:hidden;display:block;min-height:330px;padding:42px 40px;border-radius:30px;color:white;background:linear-gradient(135deg,var(--pine-2),#1d6254);box-shadow:var(--shadow)}
    .guide-hero:after{content:"";position:absolute;width:360px;height:360px;right:-120px;top:-190px;border:70px solid rgba(243,189,77,.13);border-radius:50%}.guide-hero h1{position:relative;margin:7px 0 14px;font:700 clamp(34px,6vw,66px)/.98 var(--serif);letter-spacing:-.04em}.guide-hero p{position:relative;max-width:620px;margin:0;color:#cfe1da;font-size:13px;line-height:1.8}.guide-summary{position:relative;display:grid;align-content:end;gap:8px}.guide-summary .metric{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.13)}.guide-summary .metric span{color:#b9d2ca}
    .guide-hero>div{position:relative;z-index:1;max-width:820px}.guide-hero p{max-width:760px}
    .route-band{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:14px;margin-top:14px;padding:13px 17px}.route-band-title{padding-right:14px;border-right:1px solid var(--line)}.route-band-title b{display:block;font:700 17px var(--serif)}.route-band-title small{display:block;margin-top:4px;color:var(--muted);font-size:8px}.route-band .route-string{padding:0;min-width:0}
    .guide-body{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;margin-top:18px}.guide-main{padding:24px}.guide-side{position:sticky;top:118px;align-self:start;display:grid;align-content:start;gap:12px}.guide-side>.panel:not(.map-card){padding:15px}.guide-side .map-card{min-height:350px}.guide-side .map-card svg{height:350px}.guide-side .map-overlay{left:10px;right:10px;bottom:10px}.guide-side .map-legend{max-width:100%;font-size:8px}.guide-side .map-mode{display:none}.guide-map-label{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 3px 0}.guide-map-label b{font:700 15px var(--serif)}.guide-map-label small{max-width:150px;text-align:right;color:var(--muted);font-size:8px}.guide h2{font:700 32px/1.1 var(--serif)}
    .global-state{overflow:hidden;padding:0!important;background:var(--pine-2)!important;color:#edf4f0;border-color:rgba(255,255,255,.08)}.global-state-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:15px 15px 12px;border-bottom:1px solid rgba(255,255,255,.1)}.global-state-head h3{margin:3px 0 0;color:var(--sun);font:700 18px var(--serif)}.global-state-head p{margin:4px 0 0;color:#91aea6;font-size:8px}.phase-chip{padding:6px 8px;border-radius:99px;color:#d7e7e1;background:rgba(255,255,255,.08);font:900 8px Georgia,serif}.global-state-grid{display:grid;grid-template-columns:1fr 1fr}.global-cell{min-width:0;padding:12px 14px;border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}.global-cell:nth-child(2n){border-right:0}.global-cell b{display:block;color:#fff;font:900 17px/1 Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.global-cell b.pending{color:#87a59d;font:900 12px/1 var(--sans)}.global-cell span{display:block;margin-top:5px;color:#8fa9a2;font-size:8px}.global-state-foot{display:flex;flex-wrap:wrap;gap:6px;padding:11px 14px}.global-state-foot span{padding:5px 7px;border-radius:99px;color:#bad0c9;background:rgba(255,255,255,.07);font-size:8px}
    .guide-route-builder{display:grid;grid-template-columns:1fr 1fr;gap:18px}.guide-route-builder .route-editor{padding-right:18px;border-right:1px solid var(--line)}
    .guide-candidate-focus{display:grid;grid-template-columns:45px minmax(0,1fr) 45px;gap:12px;align-items:center}.focus-arrow{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;color:var(--ink);background:white}.focus-card{padding:22px;border-radius:24px;background:linear-gradient(150deg,#fffdf8,#ece1cd);border:1px solid var(--line)}.focus-card .candidate-title h3{font-size:28px}.focus-card .candidate-reason{font-size:12px}.focus-count{text-align:center;margin-top:12px;color:var(--muted);font-size:10px}
    .guide .pref{padding:10px 12px}.guide .question{padding:14px}.guide-next{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}.guide-next p{margin:0;color:var(--muted);font-size:10px}

    /* Variant C: route timeline composer */
    .timeline-ui{min-height:calc(100vh - 70px);color:#e8f1ec;background:#102b2c}.timeline-ui .stagebar{color:var(--ink)}.timeline-head{display:flex;align-items:end;justify-content:space-between;gap:20px;padding:28px 30px 16px}.timeline-head h1{margin:4px 0 0;font:700 clamp(30px,5vw,54px)/1 var(--serif)}.timeline-head p{max-width:520px;margin:0;color:#9dbab3;font-size:11px;line-height:1.65}.timeline-board{padding:0 30px 30px;overflow:auto}.rail{display:flex;align-items:stretch;min-width:1180px;padding:26px 20px 32px}.rail-node{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:155px;max-width:180px;padding:18px 15px;border-radius:20px;color:var(--ink);background:#fff8eb;border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 30px rgba(0,0,0,.18)}.rail-node:after{content:"";position:absolute;right:-40px;top:50%;width:40px;height:2px;background:#6c8984}.rail-node.soft{color:#eaf1ed;background:#1a554b}.rail-node small{color:var(--red);font-size:8px;font-weight:900;letter-spacing:.1em}.rail-node.soft small{color:var(--sun)}.rail-node b{margin-top:8px;font:700 20px var(--serif)}.rail-node span{margin-top:8px;color:var(--muted);font-size:9px;line-height:1.5}.rail-node.soft span{color:#b8cec7}.rail-gap{position:relative;display:flex;align-items:center;justify-content:center;min-width:82px}.rail-gap:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#6c8984}.gap-add{position:relative;z-index:2;width:34px;height:34px;border:2px solid #6c8984;border-radius:50%;color:#b6ccc6;background:#102b2c;font-weight:900}
    .timeline-work{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;padding:0 30px 30px}.timeline-work .panel{padding:18px;background:#f7efdf}.timeline-work .candidate-list{grid-template-columns:repeat(2,minmax(0,1fr))}.timeline-work .state-summary{height:100%}.timeline-controls{display:grid;gap:12px}.timeline-controls .panel{color:var(--ink)}
    .load-bars{display:grid;gap:8px}.load-row{display:grid;grid-template-columns:56px 1fr 44px;align-items:center;gap:8px;font-size:9px}.load-track{position:relative;height:15px;border-radius:99px;background:#dcd4c6;overflow:hidden}.load-drive,.load-play{position:absolute;left:0;height:50%}.load-drive{top:0;background:var(--red)}.load-play{bottom:0;background:var(--sky)}.load-row b{text-align:right}

    /* Fixed report preview */

    let candidates = [
      { id:'quanzhou', name:'泉州', segment:'杭州 → 东山岛', after:'杭州', order:1, detour:24, drive:.4, stay:.8, tags:['人文','美食','低绕行'], pet:'古城户外段友好', ev:'城区补能成熟', reason:'把一段长途南下拆开，同时获得不可替代的闽南古城体验。' },
      { id:'chaoshan', name:'潮汕', segment:'东山岛 → 澳门', after:'东山岛', order:1, detour:36, drive:.7, stay:.6, tags:['美食','人文','夜生活'], pet:'餐饮时需轮流照看', ev:'城市快充密集', reason:'顺着海岸线换口味，半天也能形成完整的牛肉火锅与老城体验。' },
      { id:'zhuhai', name:'珠海', segment:'东山岛 → 澳门', after:'东山岛', order:2, detour:18, drive:.3, stay:.5, tags:['海景','宠物友好','缓冲'], pet:'适合作澳门寄养/接驳基地', ev:'补能非常容易', reason:'它不是核心景点，而是把澳门过境、宠物安排和补能变得从容的功能型停留。' },
      { id:'zhaoxing', name:'肇兴侗寨', segment:'柳州 → 恩施', after:'柳州', order:1, detour:112, drive:1.9, stay:1, tags:['人文','山景','少数民族'], pet:'寨内步行需确认住宿', ev:'县城补满再进山', reason:'人文浓度强，但会把路线向东南拉回；适合把侗寨放在贵州第一优先的人。' },
      { id:'kaili', name:'凯里', segment:'柳州 → 恩施', after:'柳州', order:2, detour:28, drive:.5, stay:1.5, tags:['美食','人文','山水','宠物友好'], pet:'苗寨户外与河谷更易同行', ev:'凯里补能后再走县道', reason:'酸汤、苗寨和巴拉河能同时补足贵州风景与美食，路线代价最低。' },
      { id:'zhenyuan', name:'镇远', segment:'柳州 → 恩施', after:'柳州', order:3, detour:74, drive:1.2, stay:1, tags:['古城','夜景','山水'], pet:'古城户外较友好', ev:'古城外围补能', reason:'山水古城的完整度高，夜间价值大，但与泉州、澳门都有一定街区体验重合。' },
      { id:'fanjing', name:'梵净山', segment:'柳州 → 恩施', after:'柳州', order:4, detour:168, drive:2.8, stay:1, tags:['山景','徒步','自然'], pet:'核心景区通常不适合随行', ev:'山脚补能需预留', reason:'单体风景强，却会增加寄养和排队风险；若后面已有恩施峡谷，体验也更接近。' }
    ];

    // 高德 Web Service 道路距离快照，采集于 2026-09-18。
    // 未命中的自定义组合会回退为经纬度估算，并在界面中明确标记。
    const roadSnapshot = { provider:'高德地图 Web Service', capturedAt:'2026-09-18' };
    const roadLegs = {
      '杭州>泉州': { km:775.490, hours:9.456 },
      '杭州>东山岛': { km:996.895, hours:11.140 },
      '泉州>东山岛': { km:246.576, hours:2.855 },
      '东山岛>潮汕': { km:122.212, hours:1.663 },
      '东山岛>珠海': { km:535.583, hours:5.905 },
      '东山岛>澳门': { km:560.426, hours:6.433 },

      '潮汕>澳门': { km:453.520, hours:5.790 },
      '珠海>澳门': { km:24.533, hours:1.280 },
      '澳门>柳州': { km:591.863, hours:6.910 },
      '柳州>肇兴侗寨': { km:254.582, hours:3.418 },
      '柳州>凯里': { km:436.471, hours:5.101 },
      '柳州>镇远': { km:432.302, hours:5.336 },
      '柳州>梵净山': { km:560.427, hours:7.544 },
      '柳州>恩施': { km:806.790, hours:8.930 },
      '肇兴侗寨>凯里': { km:225.674, hours:2.936 },
      '肇兴侗寨>镇远': { km:195.165, hours:2.737 },
      '肇兴侗寨>梵净山': { km:323.290, hours:4.857 },
      '肇兴侗寨>恩施': { km:637.440, hours:7.175 },
      '凯里>镇远': { km:93.274, hours:2.084 },
      '凯里>梵净山': { km:234.253, hours:3.669 },
      '凯里>恩施': { km:552.769, hours:6.406 },
      '镇远>梵净山': { km:160.322, hours:2.839 },
      '镇远>恩施': { km:499.621, hours:5.856 },
      '梵净山>恩施': { km:440.104, hours:5.670 },
      '恩施>宜昌': { km:218.916, hours:3.390 },
      '宜昌>杭州': { km:1002.684, hours:11.218 }
    };

    const preferenceKeys = ['美食','海岛','海景','人文','山景','峡谷','少数民族','自驾公路','宠物友好','低强度','低人流'];
    const preferenceCycles = ['off','prefer','must','avoid'];
    const preferenceLabels = { off:'未选', prefer:'偏好', must:'必有', avoid:'避开' };

    const state = {
      variant: new URLSearchParams(location.search).get('variant') || 'guide',
      stage: 1,
      route: { start:'杭州', end:'杭州', must:['东山岛','澳门','柳州','恩施','宜昌'] },
      prefs: { '美食':'off','海岛':'off','海景':'off','人文':'off','山景':'off','峡谷':'off','少数民族':'off','自驾公路':'off','宠物友好':'off','低强度':'off','低人流':'off' },
      answers: { departDate:'', returnDate:'', departTime:'19:00', maxDrive:'', pace:'', pet:false, ev:false, boarding:false },
      candidateStatus: { quanzhou:'none', chaoshan:'none', zhuhai:'none', zhaoxing:'none', kaili:'none', zhenyuan:'none', fanjing:'none' },
      focusCandidate: 0,
      ai: { status:'checking', message:'正在等待当前 Codex 会话…', source:'static', summary:'', reportUrl:'', backendReady:false, ended:false },
      webMcpRegistered: false
    };
    if (!VARIANTS.some(v => v.key === state.variant)) state.variant = 'atlas';

    const app = document.getElementById('app');
    const toastEl = document.getElementById('toast');
    let toastTimer;

    const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const statusOf = id => state.candidateStatus[id] || 'none';
    const selectedCandidates = () => candidates.filter(c => statusOf(c.id) === 'selected');
    const backupCandidates = () => candidates.filter(c => statusOf(c.id) === 'backup');
    const excludedCandidates = () => candidates.filter(c => statusOf(c.id) === 'excluded');
    const coordFor = name => cityCatalog[name] || null;
    const datesReady = () => {
      if (!state.answers.departDate || !state.answers.returnDate) return false;
      const start = new Date(`${state.answers.departDate}T00:00:00`);
      const end = new Date(`${state.answers.returnDate}T00:00:00`);
      return Number.isFinite(start.getTime()) && Number.isFinite(end.getTime()) && end >= start;
    };
    const planningReady = () => datesReady() && Number(state.answers.maxDrive) > 0;

    function roadLeg(from,to){
      const exact=roadLegs[`${from.name}>${to.name}`];
      if(exact) return { ...exact, source:'amap' };
      const km=haversine(from,to)*1.22;
      return { km, hours:km/82, source:'estimate' };
    }

    function routeRoadStats(nodes){
      let km=0, driveHours=0, exactLegs=0;
      const legs=[];
      for(let i=1;i<nodes.length;i++){
        const leg=roadLeg(nodes[i-1],nodes[i]);
        km+=leg.km; driveHours+=leg.hours; if(leg.source==='amap')exactLegs++;
        legs.push({ from:nodes[i-1].name, to:nodes[i].name, ...leg });
      }
      return { km, driveHours, chargeHours:state.answers.ev?km/330*.45:0, source:exactLegs===legs.length?'amap':exactLegs?'mixed':'estimate', legs };
    }

    function candidateScore(c){
      let score = 63;
      c.tags.forEach(tag => {
        const mode = state.prefs[tag];
        if (mode === 'must') score += 9;
        if (mode === 'prefer') score += 5;
        if (mode === 'avoid') score -= 15;
      });
      if (state.answers.pet && /友好|户外|基地/.test(c.pet)) score += 4;
      if (state.answers.pet && /不适合|寄养/.test(c.pet)) score -= 7;
      if (state.answers.ev && /预留|县道|山脚/.test(c.ev)) score -= 3;
      if (state.prefs['低强度'] === 'must' || state.prefs['低强度'] === 'prefer'){
        const impact=candidateImpact(c);
        score-=Math.round(Math.max(0,impact.drive)*2+Math.max(0,impact.km)/80);
      }
      return Math.max(38, Math.min(97, score));
    }

    function routeNodes(selectedOverride){
      const anchors = [state.route.start, ...state.route.must, state.route.end].map((name, index) => ({ name, kind:'hard', index, ...(coordFor(name) || {}) }));
      const included=(selectedOverride || selectedCandidates()).slice().sort((a,b) => a.order-b.order);
      included.forEach(candidate => {
        const anchorNames = anchors.map(n => n.name);
        let index = candidate.after === state.route.start ? 0 : anchorNames.indexOf(candidate.after);
        if (index < 0) index = Math.max(0, anchors.length - 2);
        while (anchors[index + 1] && anchors[index + 1].kind === 'soft' && anchors[index + 1].after === candidate.after && anchors[index + 1].order <= candidate.order) index++;
        anchors.splice(index + 1, 0, { name:candidate.name, kind:'soft', after:candidate.after, order:candidate.order, ...coordFor(candidate.name), candidate });
      });
      return anchors;
    }

    function candidateImpact(candidate){
      const without=selectedCandidates().filter(item=>item.id!==candidate.id);
      const withCandidate=[...without,candidate];
      const base=routeRoadStats(routeNodes(without));
      const next=routeRoadStats(routeNodes(withCandidate));
      const baseTotalHours=base.driveHours+base.chargeHours;
      const nextTotalHours=next.driveHours+next.chargeHours;
      return {
        km:Number((next.km-base.km).toFixed(1)),
        drive:Number((nextTotalHours-baseTotalHours).toFixed(1)),
        source:base.source==='amap'&&next.source==='amap'?'amap':'mixed'
      };
    }

    function haversine(a,b){
      if (!a || !b || !Number.isFinite(a.lat) || !Number.isFinite(b.lat)) return 360;
      const toRad = v => v * Math.PI / 180;
      const dLat = toRad(b.lat-a.lat), dLon = toRad(b.lon-a.lon);
      const x = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
      return 6371 * 2 * Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
    }

    function routeStats(){
      const nodes = routeNodes();
      const road=routeRoadStats(nodes);
      const km=road.km;
      const drive=road.driveHours+road.chargeHours;
      const stayDays = nodes.slice(1,-1).reduce((sum,node) => sum + (node.candidate?.stay ?? coordFor(node.name)?.stay ?? 1),0);
      const play = stayDays * 7;
      if (!planningReady()) return { km:Number(km.toFixed(1)), drive:Number(drive.toFixed(1)), play:Math.round(play), pressure:null, availableDays:null, load:null, source:road.source, road };
      const availableDays = Math.floor((new Date(`${state.answers.returnDate}T00:00:00`)-new Date(`${state.answers.departDate}T00:00:00`))/86400000)+1;
      const load = (drive / Number(state.answers.maxDrive) + stayDays) / availableDays;
      const pressure = load <= .72 ? '舒缓' : load <= .98 ? '均衡' : '偏赶';
      return { km:Number(km.toFixed(1)), drive:Number(drive.toFixed(1)), play:Math.round(play), pressure, availableDays, load, source:road.source, road };
    }

    function addDays(date,count){ const next = new Date(date); next.setDate(next.getDate()+count); return next; }
    function formatDate(date){ return `${date.getMonth()+1}/${date.getDate()}`; }

    function schedule(){
      if (!planningReady()) return [];
      const nodes = routeNodes();
      const days = [];
      let date = new Date(`${state.answers.departDate}T00:00:00`);
      days.push({ date:formatDate(date), title:`${state.answers.departTime} 从${state.route.start}出发`, subtitle:'夜间启程', plan:'只推进到安全状态允许的位置；充电与休息按实时路况决定。', drive:4.5, play:.5, stay:'弹性休息走廊' });
      for(let i=1;i<nodes.length;i++){
        date = addDays(date,1);
        const from = nodes[i-1], to = nodes[i];
        const leg = roadLeg(from,to);
        const km = leg.km;
        const charge = state.answers.ev ? km/330*.45 : 0;
        const drive = Math.max(.5, leg.hours + charge);
        const profile = to.candidate || coordFor(to.name) || { stay:1, highlight:'按兴趣生成当地核心体验' };
        const stay = to.name === state.route.end && i === nodes.length-1 ? 0 : (profile.stay ?? 1);
        const play = stay === 0 ? .5 : Math.max(2,Math.min(5.5,stay*5.2-Math.max(0,drive-4)*.35));
        const plan = profile.highlight || profile.reason || '抵达后安排该地最有区分度的体验。';
        days.push({ date:formatDate(date), title:`${from.name} → ${to.name}`, subtitle:`${leg.source==='amap'?'高德道路快照':'道路估算'} ${km.toFixed(1)} km · ${drive.toFixed(1)}h${state.answers.ev?' 含补能':''}`, plan:drive > Number(state.answers.maxDrive) ? `长转场，拆成弹性休息区间；抵达后：${plan}` : plan, drive, play, stay:stay ? `${to.name} · ${stay} 天` : '返程抵达' });
        const fullDays = Math.max(0,Math.floor(stay-.6));
        for(let j=0;j<fullDays;j++){
          date = addDays(date,1);
          days.push({ date:formatDate(date), title:`${to.name}完整体验日${fullDays>1 ? ` ${j+1}` : ''}`, subtitle:'少开车，把时间留在目的地', plan, drive:.5, play:7.5, stay:`${to.name}住宿区` });
        }
      }
      return days;
    }

    function header(){
      const working=state.ai.status==='loading';
      const action=state.stage<3?'ai-candidates':'ai-plan';
      const actionLabel=state.stage<3?'让 Codex 推荐':'让 Codex 生成完整路书';
      return `<header class="topbar">
        <div class="brand"><div class="brand-mark">R</div><div class="brand-copy"><b>路书工坊</b><span>CODEX-NATIVE ROADTRIP PLANNER</span></div></div>
        <div class="top-actions"><span class="prototype-badge">${working?'Codex 正在处理':state.ai.backendReady?'当前会话在线':'等待当前会话'}</span><button class="secondary" type="button" data-action="show-state">查看已确认条件</button><button class="session-end" type="button" data-action="end-session" ${working||state.ai.ended?'disabled':''}>结束会话</button><button class="primary" type="button" data-action="${action}" ${working||state.ai.ended?'disabled':''}>${working?'Codex 运行中…':actionLabel}</button></div>
      </header>${aiStatusStrip()}${stageBar()}`;
    }

    function aiStatusStrip(){
      const status=state.ai.status==='idle'&&state.ai.backendReady?'ready':state.ai.status;

      return `<div class="ai-run-state" data-status="${esc(status)}"><i class="ai-pulse"></i><span>${esc(state.ai.message||fallback)}</span></div>`;
    }

    function stageBar(){
      const stages = [['必去点','锁定骨架'],['必要问题','只问会改变路线的'],['候选点','加入 / 备选 / 排除'],['成品','固定模板计划']];
      return `<nav class="stagebar" aria-label="规划步骤">${stages.map((item,index) => `<button type="button" class="stage ${state.stage===index+1?'is-active':''}" data-stage="${index+1}"><i>${index+1}</i><span>${item[0]}</span></button>${index<stages.length-1?'<span class="stage-divider"></span>':''}`).join('')}</nav>`;
    }

    function routeEditor(){
      return `<div class="route-editor">

          <label class="field"><span>从哪里出发</span><input value="${esc(state.route.start)}" list="cityOptions" data-route-field="start"></label>
          <label class="field"><span>最终回到</span><input value="${esc(state.route.end)}" list="cityOptions" data-route-field="end"></label>
        </div>
        <span class="kicker">LOCKED ANCHORS</span>
        <div class="must-list">${state.route.must.map((name,index) => `<div class="must-stop"><span class="lock">◆</span><div><b>${esc(name)}</b><small>必去 · AI 不得删除</small></div><div class="must-actions"><button type="button" class="mini" data-action="move-stop" data-index="${index}" data-dir="-1" aria-label="上移">↑</button><button type="button" class="mini" data-action="move-stop" data-index="${index}" data-dir="1" aria-label="下移">↓</button><button type="button" class="mini" data-action="remove-stop" data-index="${index}" aria-label="删除">×</button></div></div>`).join('')}</div>
        <div class="add-row"><input id="newMustStop" list="cityOptions" placeholder="输入新的必去点"><button type="button" class="primary" data-action="add-stop">锁定</button></div>

    function preferenceEditor(){
      return `<div><span class="kicker">EXPERIENCE KEYWORDS</span><div class="pref-grid">${preferenceKeys.map(key => { const mode=state.prefs[key]||'off'; return `<button type="button" class="pref" data-pref="${esc(key)}" data-state="${mode}" data-state-label="${preferenceLabels[mode]}">${esc(key)}</button>`; }).join('')}</div><p class="helper">点击循环：未选 → 偏好 → 必有 → 避开。它会立即影响候选排序。</p></div>`;

    function questions(){
      return `<div class="question-grid">
        <label class="question"><span>出发日期</span><input type="date" value="${state.answers.departDate}" data-answer="departDate"></label>

        <label class="question"><span>出发时间</span><input type="time" value="${state.answers.departTime}" data-answer="departTime"></label>
        <label class="question"><span>单日舒适驾驶</span><select data-answer="maxDrive"><option value="" ${state.answers.maxDrive===''?'selected':''}>请选择</option><option value="4" ${state.answers.maxDrive==='4'?'selected':''}>约 4 小时</option><option value="6" ${state.answers.maxDrive==='6'?'selected':''}>约 6 小时</option><option value="8" ${state.answers.maxDrive==='8'?'selected':''}>约 8 小时</option></select></label>

      </div>`;

    function metrics(){
      if (state.stage === 1) return `<div class="metrics"><div class="metric"><b>${state.route.must.length}</b><span>已锁定必去点</span></div><div class="metric"><b class="is-pending">尚未选择</b><span>沿途候选点</span></div><div class="metric"><b class="is-pending">暂不估算</b><span>最终路线与里程</span></div><div class="metric"><b class="is-pending">待填写</b><span>日期与驾驶压力</span></div></div>`;
      if (!planningReady()) return `<div class="metrics"><div class="metric"><b>${state.route.must.length}</b><span>已锁定必去点</span></div><div class="metric"><b class="is-pending">待填写</b><span>出发与返程日期</span></div><div class="metric"><b class="is-pending">待选择</b><span>单日舒适驾驶</span></div><div class="metric"><b class="is-pending">尚未计算</b><span>驾驶压力</span></div></div>`;
      const stats = routeStats();
      const scope = selectedCandidates().length ? '当前路线' : '仅必去点基线';
      const sourceLabel=stats.source==='amap'?'高德道路快照':'含估算路段';
      return `<div class="metrics"><div class="metric"><b>${stats.km.toLocaleString('zh-CN',{maximumFractionDigits:1})}</b><span>${scope} · ${sourceLabel} km</span></div><div class="metric"><b>${stats.drive}h</b><span>驾驶＋${state.answers.ev?'补能':'休息'}估算</span></div><div class="metric"><b>${stats.availableDays}天</b><span>已确认可用时间</span></div><div class="metric"><b>${stats.pressure}</b><span>${scope} · 驾驶压力</span></div></div>`;
    }

    function routeString(){
      return `<div class="route-string">${routeNodes().map((node,index) => `${index?'<span class="route-arrow">→</span>':''}<span class="route-node ${node.kind}">${node.kind==='hard'?'◆':'＋'} ${esc(node.name)}</span>`).join('')}</div>`;
    }

    function mapView(){
      const nodes = routeNodes().filter(n => Number.isFinite(n.lon));
      const optionalNodes = state.stage >= 3 ? candidates.filter(c => statusOf(c.id) !== 'selected').map(c => ({...coordFor(c.name),name:c.name,kind:'optional',status:statusOf(c.id)})).filter(n => n.lon) : [];
      const all = [...nodes, ...optionalNodes];
      const lons = all.map(n=>n.lon), lats=all.map(n=>n.lat);
      const minLon=Math.min(...lons)-.6,maxLon=Math.max(...lons)+.6,minLat=Math.min(...lats)-.5,maxLat=Math.max(...lats)+.5;
      const project = n => ({ x:55+(n.lon-minLon)/(maxLon-minLon)*750, y:45+(maxLat-n.lat)/(maxLat-minLat)*360 });
      const points = nodes.map(n => {const p=project(n);return `${p.x.toFixed(1)},${p.y.toFixed(1)}`}).join(' ');
      const routeLabels = nodes.map((n,index) => { const p=project(n); const fill=n.kind==='hard'?'#e65c3d':'#123f37'; return `<g transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})"><circle r="14" fill="${fill}" stroke="#fffdf6" stroke-width="3"></circle><text x="0" y="4" text-anchor="middle" fill="white" font-size="10" font-weight="900">${index+1}</text><text x="0" y="31" text-anchor="middle" fill="#183b36" font-size="10" font-weight="900" paint-order="stroke" stroke="#fffdf6" stroke-width="4">${esc(n.name)}</text></g>`; }).join('');
      const optional = all.filter(n=>n.kind==='optional').map(n => { const p=project(n); const excluded=n.status==='excluded'; return `<g opacity="${excluded ? .35 : .72}" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})"><circle r="8" fill="#fffdf6" stroke="${excluded?'#756c68':'#236d78'}" stroke-width="3" stroke-dasharray="${n.status==='backup'?'0':'3 2'}"></circle><text x="0" y="22" text-anchor="middle" fill="#236d78" font-size="8" font-weight="800" paint-order="stroke" stroke="#fffdf6" stroke-width="3">${esc(n.name)}</text></g>`; }).join('');
      const legend = state.stage < 3 ? `<div class="legend-row"><span><i class="dot locked"></i>必去点</span></div><div>目前只画路线骨架，不代表最终道路，也暂不计算里程和驾驶压力。</div>` : `<div class="legend-row"><span><i class="dot locked"></i>必去点</span><span><i class="dot selected"></i>已加入候选</span><span><i class="dot optional"></i>待决定</span></div><div>候选只有在“加入路线”后，才会进入里程和行程计算。</div>`;
      return `<div class="panel map-card"><svg viewBox="0 0 860 450" role="img" aria-label="路线总览示意地图">
        <defs><filter id="routeShadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#183b36" flood-opacity=".24"/></filter><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#183b36" stroke-opacity=".07"/></pattern></defs>
        <rect width="860" height="450" fill="url(#grid)"></rect><path d="M40 118 C170 25 270 83 365 48 S585 90 820 27 M14 330 C180 250 252 351 408 286 S667 304 846 210" fill="none" stroke="#6f9d91" stroke-opacity=".25" stroke-width="2"></path>
        <polyline points="${points}" fill="none" stroke="#fffdf6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#routeShadow)"></polyline><polyline points="${points}" fill="none" stroke="#e65c3d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"></polyline>${optional}${routeLabels}
      </svg><div class="map-overlay"><div class="map-legend">${legend}</div><div class="map-mode">${state.stage<3?'仅显示骨架':'路线随选择更新'}</div></div></div>`;
    }

    function candidateCard(c, focus=false){
      const status=statusOf(c.id), score=candidateScore(c);
      const impact=state.ai.source==='codex'?{km:c.detour,drive:c.drive,source:'codex'}:candidateImpact(c);
      const sign=value=>value>0?'+':'';
      const sourceLabel=impact.source==='codex'?'Codex 核验增量':impact.source==='amap'?'高德道路增量':'含估算路段';
      return `<article class="candidate ${focus?'focus-card':''}" data-status="${status}">
        <div class="candidate-top"><div class="candidate-title"><h3>${esc(c.name)}</h3><small>${esc(c.segment)} · ${status==='selected'?'已加入路线':status==='backup'?'备选，不计入路线':status==='excluded'?'已排除':'等待你的决定'}</small></div><div class="score">${score}<small>/100</small></div></div>
        <p class="candidate-reason"><b>为什么出现：</b>${esc(c.reason)}</p>
        <div class="candidate-facts"><div class="fact"><b>${sign(impact.km)}${impact.km} km</b>${sourceLabel}</div><div class="fact"><b>${sign(impact.drive)}${impact.drive} h</b>额外驾驶${state.answers.ev?'＋补能':''}</div><div class="fact"><b>${c.stay} 天</b>建议停留</div></div>
        <div class="tags">${c.tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}<span class="tag">🐾 ${esc(c.pet)}</span><span class="tag">⚡ ${esc(c.ev)}</span></div>
        <div class="candidate-actions"><button type="button" class="status-btn ${status==='selected'?'is-active':''}" data-candidate="${c.id}" data-status-choice="selected">加入路线</button><button type="button" class="status-btn ${status==='backup'?'is-active':''}" data-candidate="${c.id}" data-status-choice="backup">放入备选</button><button type="button" class="status-btn ${status==='excluded'?'is-active':''}" data-candidate="${c.id}" data-status-choice="excluded">排除</button></div>
      </article>`;
    }

    function candidateList(limit){
      const list=[...candidates].sort((a,b)=>candidateScore(b)-candidateScore(a));
      return `<div class="candidate-list">${list.slice(0,limit||list.length).map(c=>candidateCard(c)).join('')}</div>`;
    }

    function stateSummary(){
      if (state.stage === 1) return `<div class="state-summary"><h3>当前只确认了这些</h3><dl><dt>出发 / 返回</dt><dd>${esc(state.route.start)} → ${esc(state.route.end)}</dd><dt>必去点</dt><dd>${state.route.must.map(esc).join('、') || '暂无'}</dd><dt>暂不计算</dt><dd>沿途候选、最终里程、每天安排与驾驶压力</dd></dl></div>`;
      const prefs=Object.entries(state.prefs).filter(([,mode])=>mode!=='off').map(([key,mode])=>`${key}(${preferenceLabels[mode]})`).join('、') || '暂无';
      return `<div class="state-summary"><h3>已确认条件</h3><dl><dt>必去</dt><dd>${[state.route.start,...state.route.must,state.route.end].map(esc).join(' → ')}</dd><dt>时间</dt><dd>${datesReady()?`${esc(state.answers.departDate)}—${esc(state.answers.returnDate)}`:'尚未填写完整'}</dd>${state.stage>=3?`<dt>已加入</dt><dd>${selectedCandidates().map(c=>esc(c.name)).join('、')||'暂无'}</dd><dt>备选</dt><dd>${backupCandidates().map(c=>esc(c.name)).join('、')||'暂无'}</dd>`:''}<dt>偏好</dt><dd>${prefs}</dd><dt>车与狗</dt><dd>${state.answers.ev?'纯电车':'未启用纯电约束'} · ${state.answers.pet?'带宠物':'未启用宠物约束'}${state.answers.pet?` · ${state.answers.boarding?'接受短时寄养':'全程同行'}`:''}</dd></dl></div>`;
    }

    function routeOrderBand(){
      return `<section class="panel route-band"><div class="route-band-title"><span class="kicker">当前顺序</span><b>${state.stage<3?'必去点骨架':'当前路线'}</b><small>${state.stage<3?'候选加入后会在这里插入':'与地图和计划保持一致'}</small></div>${routeString()}</section>`;
    }

    function globalDashboard(){
      const ready=planningReady(), stats=routeStats();
      const selected=selectedCandidates().length, backups=backupCandidates().length;
      const reviewed=candidates.filter(c=>statusOf(c.id)!=='none').length;
      const stageName=['','路线骨架','必要信息','候选评审','计划预览'][state.stage];
      const cell=(value,label,pending=false)=>`<div class="global-cell"><b class="${pending?'pending':''}">${value}</b><span>${label}</span></div>`;
      const selectionVisible=state.stage>=3;
      const cells=[
        cell(state.route.must.length,'已锁定必去点'),
        cell(selectionVisible?selected:'—',selectionVisible?'已加入沿途点':'候选尚未生成',!selectionVisible),
        cell(selectionVisible?backups:'—',selectionVisible?'已放入备选':'候选尚未评审',!selectionVisible),
        cell(ready?`${stats.availableDays}天`:'—',ready?'可用旅行时间':'时间尚未填完整',!ready),
        cell(ready?stats.km.toLocaleString('zh-CN',{maximumFractionDigits:1}):'—',ready?(stats.source==='amap'?'高德道路快照 · km':'含估算路段 · km'):'路线里程待计算',!ready),
        cell(ready?`${stats.drive}h`:'—',ready?`驾驶＋${state.answers.ev?'补能':'休息'}估算`:'驾驶时长待计算',!ready),
        cell(ready?`${stats.play}h`:'—',ready?'目的地建议体验':'游玩时间待安排',!ready),
        cell(ready?stats.pressure:'—',ready?'当前驾驶压力':'驾驶压力待计算',!ready)
      ].join('');
      const foot=[
        datesReady()?`${state.answers.departDate}—${state.answers.returnDate}`:'日期待填写',
        state.answers.maxDrive?`舒适驾驶 ≤ ${state.answers.maxDrive}h/天`:'驾驶上限待选择',
        state.stage>=3?`候选已处理 ${reviewed}/${candidates.length}`:'候选尚未开始',
        state.answers.ev?'纯电车':null,
        state.answers.pet?'带宠物':null,
        ready?(stats.source==='amap'?`${roadSnapshot.provider} · ${roadSnapshot.capturedAt}`:'部分路段尚无高德快照'):null
      ].filter(Boolean).map(item=>`<span>${esc(item)}</span>`).join('');
      return `<section class="panel global-state"><div class="global-state-head"><div><span class="kicker" style="color:#f3bd4d">全局状态</span><h3>${stageName}</h3><p>只展示当前已经能够确定或计算的结果</p></div><span class="phase-chip">STEP ${state.stage} / 4</span></div><div class="global-state-grid">${cells}</div><div class="global-state-foot">${foot}</div></section>`;
    }

    function report(){
      if(state.ai.reportUrl) return `<section class="panel generated" id="reportPreview"><div class="report-hero"><span class="kicker" style="color:#f3bd4d">CODEX GENERATED ROADBOOK</span><h2>完整路书已经生成。</h2><p>这份报告由 Codex 根据页面最终状态重新规划，并按南线报告的信息结构输出。</p><div class="report-actions"><a class="secondary" href="${esc(state.ai.reportUrl)}" target="_blank" rel="noopener">单独打开完整报告</a><button type="button" class="ghost" style="color:white;border-color:rgba(255,255,255,.25)" data-action="ai-plan">重新生成</button></div></div><div class="ai-result-summary"><b>Codex 结论：</b>${esc(state.ai.summary||'已完成路线、逐日安排、住宿、宠物与纯电策略。')}</div><iframe class="ai-report-frame" src="${esc(state.ai.reportUrl)}" title="Codex 生成的完整自驾旅行计划"></iframe></section>`;
      const stats=routeStats(), days=schedule();
      const overtime=days.filter(d=>d.drive>Number(state.answers.maxDrive));
      return `<section class="panel generated" id="reportPreview"><div class="report-hero"><span class="kicker" style="color:#f3bd4d">FIXED ROADBOOK PREVIEW</span><h2>把必去点锁住，<br>把沿途选择权留给你。</h2><p>${routeNodes().map(n=>esc(n.name)).join(' → ')}。计划只展示当前结论，不记录来回修改的过程。</p><div class="report-actions"><button type="button" class="secondary" data-action="download">下载独立 HTML</button><button type="button" class="ghost" style="color:white;border-color:rgba(255,255,255,.25)" data-action="print">打印 / PDF</button></div></div><div class="report-body">${metrics()}<div class="report-grid"><div><div class="panel-head"><div><span class="kicker">DAY BY DAY</span><h3>逐日时间轴与驾驶热度</h3><p>红色为驾驶，蓝色为有效游玩；数字由当前选择即时估算。</p></div></div><div class="day-list">${days.map((day,index)=>`<div class="day-row"><div class="day-date">D${index}<br>${day.date}</div><div class="day-title"><b>${esc(day.title)}</b><small>${esc(day.subtitle)}</small></div><div class="day-plan">${esc(day.plan)}<br><b>住宿：</b>${esc(day.stay)}</div><div class="day-bars"><div class="bar"><span>驾驶</span><div class="bar-track"><div class="bar-fill drive" style="width:${Math.min(100,day.drive/10*100)}%"></div></div><b>${day.drive.toFixed(1)}h</b></div><div class="bar"><span>游玩</span><div class="bar-track"><div class="bar-fill play" style="width:${Math.min(100,day.play/9*100)}%"></div></div><b>${day.play.toFixed(1)}h</b></div></div></div>`).join('')}</div></div><aside class="report-aside"><div class="report-block"><h3>这版计划的重点</h3><ul><li>${selectedCandidates().length} 个候选点已被你正式加入。</li><li>必去点始终锁定，不参与 AI 淘汰。</li><li>落脚休息采用区间，不伪装成旅游目的地。</li></ul></div><div class="report-block warning"><h3>需要处理的压力</h3><p>${overtime.length?`有 ${overtime.length} 个长转场超过 ${state.answers.maxDrive} 小时舒适值，正式规划时需拆成弹性休息区间。`:'没有转场超过当前舒适驾驶阈值。'}</p></div><div class="report-block"><h3>宠物与纯电</h3><p>${state.answers.pet?'景区、轮渡、跨境和住宿需逐项核验宠物规则；不把留车内作为默认方案。':'本次未启用宠物约束。'} ${state.answers.ev?'正式路线要把充电、排队和到站余量计入时长。':'本次未启用纯电约束。'}</p></div><div class="report-block"><h3>演示边界</h3><p>当前里程与时长是原型估算。生产版会接入地图、实时政策与预订数据，并显示来源与更新时间。</p></div></aside></div></div></section>`;
    }

    function atlasVariant(){
      return `<div class="atlas"><div class="atlas-grid"><aside class="atlas-left"><section class="panel"><div class="panel-head"><div><span class="kicker">01 · MUST GO</span><h3>先锁定骨架</h3><p>红色锚点不会被 AI 调整。</p></div></div>${routeEditor()}</section><section class="panel"><div class="panel-head"><div><span class="kicker">02 · SIGNALS</span><h3>体验关键词</h3></div></div>${preferenceEditor()}</section><section class="panel"><div class="panel-head"><div><span class="kicker">NECESSARY ONLY</span><h3>必要信息</h3></div></div>${questions()}</section></aside><main class="atlas-center">${metrics()}${mapView()}<section class="panel"><span class="kicker">LIVE ROUTE</span>${routeString()}<div class="ai-note"><b>AI 判断：</b>凯里在当前偏好下得分最高，因为它同时补足贵州美食、人文与山水，且比梵净山减少宠物分离和额外绕行。</div></section>${state.stage===4?report():''}</main><aside class="atlas-right"><section class="panel"><div class="panel-head"><div><span class="kicker">03 · REVIEW</span><h3>沿途候选</h3><p>加入才会改变地图与行程；备选不会。</p></div><button type="button" class="ghost" data-stage="4">预览成品</button></div>${candidateList()}</section>${stateSummary()}</aside></div></div>`;

    function guideContent(){
      if(state.stage===1) return `<div class="guide-route-builder"><div>${routeEditor()}</div><div><div class="panel-head"><div><span class="kicker">先定必去</span><h2>这里只搭骨架，<br>还不计算行程。</h2><p>先确认一定要去的地方。沿途停哪里、开多久、赶不赶，等下一步补齐时间和节奏后再算。</p></div></div><div class="ai-note"><b>现在只做一件事：</b>确认出发地、返回地和非去不可的地方。右侧地图会持续保留，并在后续选择中实时改线。</div></div></div><div class="guide-next"><p>下一步只回答会真正改变路线的问题。</p><button class="primary" type="button" data-stage="2">继续：必要问题 →</button></div>`;
      if(state.stage===2) return `<div class="panel-head"><div><span class="kicker">MINIMUM INTERVIEW</span><h2>六个答案，足够开始。</h2><p>其余信息交给 Codex 检索和判断，不让你先填一张长表。</p></div></div>${questions()}<div style="margin-top:20px">${preferenceEditor()}</div><div class="guide-next"><button class="ghost" type="button" data-stage="1">← 返回骨架</button><button class="primary" type="button" data-action="ai-candidates" ${state.ai.status==='loading'?'disabled':''}>${state.ai.status==='loading'?'Codex 正在规划…':'让 Codex 生成沿途候选 →'}</button></div>`;
      if(state.stage===3){ const sorted=[...candidates].sort((a,b)=>candidateScore(b)-candidateScore(a)); const index=Math.max(0,Math.min(state.focusCandidate,sorted.length-1)); const c=sorted[index]; return `<div class="panel-head"><div><span class="kicker">ONE DECISION AT A TIME</span><h2>这个地方，值不值得拐进去？</h2><p>${state.ai.source==='codex'?'这些候选来自本机 Codex 的真实规划结果。':'当前显示备用候选；连接 Codex 后会重新生成。'}</p></div><button class="ghost" type="button" data-action="ai-candidates">重新问 Codex</button></div><div class="guide-candidate-focus"><button class="focus-arrow" data-action="focus-prev" aria-label="上一个候选">←</button>${candidateCard(c,true)}<button class="focus-arrow" data-action="focus-next" aria-label="下一个候选">→</button></div><div class="focus-count">${index+1} / ${sorted.length} · 按推荐度排序</div><div class="guide-next"><button class="ghost" type="button" data-stage="2">← 修改条件</button><button class="primary" type="button" data-action="ai-plan" ${state.ai.status==='loading'?'disabled':''}>${state.ai.status==='loading'?'Codex 正在生成…':'完成评审，让 Codex 生成完整路书 →'}</button></div>`; }
      return report();
    }

    function guideVariant(){
      return `<div class="guide"><div class="guide-shell"><section class="guide-hero"><div><span class="kicker" style="color:#f3bd4d">先把路线搭起来</span><h1>先定下非去不可，<br>再挑沿途值得停。</h1><p>把一定要去的地方先放进路线，再看看沿途哪些地方值得多留一晚。每加一站，都把能玩什么、要多开多久、建议留几天说清楚。</p></div></section>${routeOrderBand()}<div class="guide-body"><main class="panel guide-main">${guideContent()}</main><aside class="guide-side"><div class="guide-map-label"><div><span class="kicker">路线预览</span><b>随选择实时更新</b></div><small>${state.stage<3?'当前只显示必去骨架':'候选加入后立即改线'}</small></div>${mapView()}${globalDashboard()}</aside></div></div></div>`;
    }

    function railView(){
      const nodes=routeNodes();
      return `<div class="rail">${nodes.map((node,index)=>`${index?'<div class="rail-gap"><button class="gap-add" type="button" data-stage="3" aria-label="查看此区间候选">＋</button></div>':''}<article class="rail-node ${node.kind}"><small>${node.kind==='hard'?'LOCKED · 必去':'SELECTED · 已加入'}</small><b>${esc(node.name)}</b><span>${esc(node.candidate?.reason || coordFor(node.name)?.highlight || '用户锁定的路线锚点')}</span></article>`).join('')}</div>`;
    }

    function loadBars(){
      const days=schedule();
      if(!days.length) return `<div class="empty" style="min-height:120px"><div><b>还不能计算</b>填写出发、返程日期和单日舒适驾驶后，再显示每天开多久、玩多久。</div></div>`;
      return `<div class="load-bars">${days.slice(0,12).map(day=>`<div class="load-row"><span>${day.date}</span><div class="load-track"><div class="load-drive" style="width:${Math.min(100,day.drive/10*100)}%"></div><div class="load-play" style="width:${Math.min(100,day.play/9*100)}%"></div></div><b>${(day.drive+day.play).toFixed(1)}h</b></div>`).join('')}</div>`;
    }

    function timelineVariant(){
      return `<div class="timeline-ui"><div class="timeline-head"><div><span class="kicker" style="color:#f3bd4d">ROUTE COMPOSER</span><h1>把旅程当成一条可编辑的线。</h1></div><p>菱形节点是你锁定的承诺；绿色节点是 Codex 候选。所有选择立即回写到同一条路线、驾驶热度和最终路书。</p></div><div class="timeline-board">${railView()}</div><div class="timeline-work"><section class="panel"><div class="panel-head"><div><span class="kicker">CANDIDATE TRAY</span><h2>把值得的地方放进旅程</h2><p>路线选择留在页面，复杂判断交给 Codex。</p></div><button class="primary" type="button" data-action="ai-plan">让 Codex 生成路书</button></div>${state.stage===4?report():candidateList(6)}</section><aside class="timeline-controls"><section class="panel"><div class="panel-head"><div><span class="kicker">LOAD MAP</span><h3>每天开多久 / 玩多久</h3></div></div>${loadBars()}<div class="helper"><span style="color:var(--red)">上半红色：驾驶</span> · <span style="color:var(--blue)">下半蓝色：游玩</span></div></section><section class="panel"><div class="panel-head"><div><span class="kicker">QUICK EDIT</span><h3>条件抽屉</h3></div></div>${questions()}<div style="margin-top:12px">${preferenceEditor()}</div></section>${stateSummary()}</aside></div></div>`;
    }

    function render(){
      let content = state.variant==='guide' ? guideVariant() : state.variant==='timeline' ? timelineVariant() : atlasVariant();
      app.innerHTML = header() + content;
      const meta=VARIANTS.find(v=>v.key===state.variant); document.getElementById('variantLabel').innerHTML=`${meta.key.toUpperCase()} — ${meta.name}<small>← → 切换三种产品方向</small>`;
    }

    function toast(message){ clearTimeout(toastTimer); toastEl.textContent=message; toastEl.classList.add('is-show'); toastTimer=setTimeout(()=>toastEl.classList.remove('is-show'),2600); }

    function plannerState(){
      return {
        route: JSON.parse(JSON.stringify(state.route)),
        preferences: JSON.parse(JSON.stringify(state.prefs)),
        answers: JSON.parse(JSON.stringify(state.answers)),
        candidates: candidates.map(candidate=>({ ...candidate, status:statusOf(candidate.id) })),
        routeOrder: routeNodes().map(node=>node.name),
        clientEstimate: planningReady()?routeStats():null
      };
    }

    function setAiState(status,message){
      state.ai.status=status;
      state.ai.message=message;
      render();
    }

    async function checkCodexStatus(){
      if(location.protocol==='file:'){
        state.ai={...state.ai,status:'error',backendReady:false,message:'当前是 file:// 静态页。请让 Codex 启动本地页面并保持等待。'};
        render();
        return;
      }
      try{
        const response=await fetch('/api/status',{cache:'no-store'});
        const data=await response.json();
        const ready=data.mode==='current-codex-thread'&&Boolean(data.runnerConnected);
        const changed=state.ai.backendReady!==ready||state.ai.status==='checking';
        state.ai.backendReady=ready;
        if(!state.ai.ended&&state.ai.status!=='loading'&&changed){
          state.ai.status=ready?'idle':'error';
          state.ai.message=ready?'当前 Codex 会话正在等待操作；点击生成后，请在 Codex 对话中查看规划过程。':'当前 Codex 会话尚未进入等待状态，请回到 Codex 对话。';
        }
        if(changed) render();
      }catch(error){
        state.ai={...state.ai,status:'error',backendReady:false,message:`无法连接本地规划服务：${error.message}`};
        render();
      }
    }

    async function waitForJob(jobId){
      while(true){
        const response=await fetch(`/api/jobs/${encodeURIComponent(jobId)}`,{cache:'no-store'});
        const data=await response.json();
        if(!response.ok||!data.ok) throw new Error(data.error||'无法读取任务进度');
        const job=data.job;
        if(job.status==='completed') return job.result;
        if(job.status==='failed') throw new Error(job.error||'Codex 未能完成任务');
        if(job.message&&job.message!==state.ai.message) setAiState('loading',job.message);
        await new Promise(resolve=>setTimeout(resolve,1500));
      }
    }

    function applyCodexCandidates(data){
      const incoming=Array.isArray(data.candidates)?data.candidates:[];
      if(!incoming.length) throw new Error('Codex 没有返回候选地点。');
      candidates=incoming.map((candidate,index)=>({
        ...candidate,
        id:String(candidate.id||`candidate-${index+1}`).toLowerCase().replace(/[^a-z0-9-]+/g,'-'),
        order:Number(candidate.order)||index+1,
        detour:Number(candidate.detour)||0,
        drive:Number(candidate.drive)||0,
        stay:Number(candidate.stay)||1,
        tags:Array.isArray(candidate.tags)?candidate.tags:[]
      }));
      state.candidateStatus={};
      candidates.forEach(candidate=>{
        state.candidateStatus[candidate.id]='none';
        cityCatalog[candidate.name]={
          lon:Number(candidate.lon),lat:Number(candidate.lat),stay:candidate.stay,
          highlight:candidate.highlight||candidate.reason
        };
      });
      state.focusCandidate=0;
      state.stage=3;
      state.ai.source='codex';
      state.ai.summary=data.summary||'';
      state.ai.reportUrl='';
    }

    async function requestCodexCandidates(){
      if(!planningReady()){
        state.stage=2;render();toast('先填写出发、返程日期和单日舒适驾驶。');return;
      }
      if(!state.ai.backendReady){toast('当前 Codex 会话尚未等待页面操作，请回到 Codex 对话。');return;}
      setAiState('loading','请求已提交；当前 Codex 会话将领取任务，过程会显示在 Codex 对话中。');
      try{
        const response=await fetch('/api/codex/candidates',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(plannerState())});
        const data=await response.json();
        if(!response.ok||!data.ok) throw new Error(data.error||'候选生成失败');
        const result=await waitForJob(data.job.id);
        applyCodexCandidates(result);
        state.ai.status='idle';
        state.ai.message=`Codex 已返回 ${candidates.length} 个候选。选择本身不会再次消耗 AI，直到你要求生成最终路书。`;
        render();
      }catch(error){
        state.ai.status='error';state.ai.message=`Codex 候选生成失败：${error.message}`;render();
      }
    }

    async function requestCodexPlan(){
      if(!planningReady()){
        state.stage=2;render();toast('先填写完整的必要信息。');return;
      }
      if(!state.ai.backendReady){toast('当前 Codex 会话尚未等待页面操作，请回到 Codex 对话。');return;}
      setAiState('loading','请求已提交；当前 Codex 会话将规划完整路书，过程会显示在 Codex 对话中。');
      try{
        const response=await fetch('/api/codex/plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(plannerState())});
        const data=await response.json();
        if(!response.ok||!data.ok) throw new Error(data.error||'完整路书生成失败');
        const result=await waitForJob(data.job.id);
        state.ai.status='idle';
        state.ai.message='Codex 已完成完整路书。页面下方已载入最终报告。';
        state.ai.summary=result.summary||'';
        state.ai.reportUrl=result.reportUrl||'/generated-plan';
        state.stage=4;
        render();
        setTimeout(()=>document.getElementById('reportPreview')?.scrollIntoView({behavior:'smooth',block:'start'}),0);
      }catch(error){
        state.ai.status='error';state.ai.message=`Codex 路书生成失败：${error.message}`;render();
      }
    }

    async function endSession(){
      if(state.ai.status==='loading') return;
      try{
        const response=await fetch('/api/bridge/stop',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
        const data=await response.json();
        if(!response.ok||!data.ok) throw new Error(data.error||'结束请求失败');
        state.ai.ended=true;
        state.ai.status='ended';
        state.ai.message='已通知当前 Codex 会话结束等待；已生成的路书仍可在本页查看。';
        render();
      }catch(error){toast(error.message);}
    }

    async function registerPlannerTools(){
      if(state.webMcpRegistered||typeof document.modelContext?.registerTool!=='function') return;
      state.webMcpRegistered=true;
      await document.modelContext.registerTool({
        name:'roadtrip_get_state',
        description:'Read the current road-trip planner state, including hard stops, dates, preferences, candidates, and candidate decisions.',
        inputSchema:{type:'object',properties:{},additionalProperties:false},
        annotations:{readOnlyHint:true},
        execute:async()=>plannerState()
      });
      await document.modelContext.registerTool({
        name:'roadtrip_generate_candidates',
        description:'Submit the current planner state to the active Codex conversation for route-aware optional stops.',
        inputSchema:{type:'object',properties:{},additionalProperties:false},
        annotations:{readOnlyHint:false,openWorldHint:true},
        execute:async()=>{await requestCodexCandidates();return {status:state.ai.status,summary:state.ai.summary,candidateCount:candidates.length};}
      });
      await document.modelContext.registerTool({
        name:'roadtrip_generate_report',
        description:'Submit the reviewed planner state to the active Codex conversation for a full HTML roadbook.',
        inputSchema:{type:'object',properties:{},additionalProperties:false},
        annotations:{readOnlyHint:false,openWorldHint:true},
        execute:async()=>{await requestCodexPlan();return {status:state.ai.status,reportUrl:state.ai.reportUrl,summary:state.ai.summary};}
      });
    }

    function setVariant(direction){
      const index=VARIANTS.findIndex(v=>v.key===state.variant); const next=(index+(direction==='next'?1:-1)+VARIANTS.length)%VARIANTS.length; state.variant=VARIANTS[next].key;
      const url=new URL(location.href); url.searchParams.set('variant',state.variant); history.replaceState({},'',url); render();
    }

    function showState(){ state.stage=1; if(state.variant==='atlas') toast('左侧就是完整条件；红色锚点为必去。'); else toast('已确认条件显示在右侧深绿色卡片中。'); render(); }

    function goToStage(nextStage){
      if(nextStage >= 3 && !planningReady()){
        state.stage=2;
        render();
        toast('先填写出发、返程日期和单日舒适驾驶，再计算路线。');
        return false;
      }
      state.stage=nextStage;
      render();
      return true;
    }

    function addStop(){
      const input=document.getElementById('newMustStop'); const name=input?.value.trim();
      if(!name) return toast('先输入一个必去点。');
      if([state.route.start,...state.route.must,state.route.end].includes(name)) return toast('这个地点已经在路线中。');
      state.route.must.push(name); state.stage=1; render(); toast(`${name} 已锁定为必去点。`);
    }

    function updateCandidate(id,nextStatus){
      const current=statusOf(id); state.candidateStatus[id]=current===nextStatus?'none':nextStatus; state.stage=3; render();
      const candidate=candidates.find(c=>c.id===id); const label=state.candidateStatus[id]==='selected'?'已加入路线':state.candidateStatus[id]==='backup'?'已放入备选':state.candidateStatus[id]==='excluded'?'已排除':'已恢复待决定'; toast(`${candidate.name}${label}。`);
    }

    function standaloneReport(){
      const stats=routeStats(), days=schedule(), route=routeNodes().map(n=>esc(n.name)).join(' → ');
      return `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的自驾旅行计划</title><style>body{margin:0;background:#f4eddf;color:#183b36;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header,main{max-width:920px;margin:auto}header{padding:70px 24px 38px;color:white;background:#123f37}h1{font-family:serif;font-size:48px;line-height:1;margin:10px 0}main{padding:24px}.route{line-height:1.8;color:#dce9e3}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stats div,.day{padding:16px;border-radius:16px;background:#fffdf6;border:1px solid rgba(24,59,54,.14)}.stats b{display:block;color:#e65c3d;font-size:24px}.day{display:grid;grid-template-columns:70px 1fr;gap:12px;margin:9px 0}.day small{color:#6e7c75}.note{padding:16px;border-radius:16px;background:#fff0db} @media(max-width:600px){h1{font-size:36px}.stats{grid-template-columns:1fr}.day{grid-template-columns:52px 1fr}}</style></head><body><header><small>ROADTRIP PLANNER · RULE-BASED PREVIEW</small><h1>我的自驾旅行计划</h1><div class="route">${route}</div></header><main><section class="stats"><div><b>${stats.km.toLocaleString('zh-CN',{maximumFractionDigits:1})} km</b>${stats.source==='amap'?'高德道路快照':'含估算路段'}</div><div><b>${stats.drive} h</b>驾驶＋补能</div><div><b>${stats.play} h</b>有效游玩</div></section><h2>逐日时间轴</h2>${days.map((d,i)=>`<article class="day"><b>D${i}<br>${d.date}</b><div><strong>${esc(d.title)}</strong><br><small>${esc(d.subtitle)}</small><p>${esc(d.plan)}</p><small>住宿：${esc(d.stay)} · 驾驶 ${d.drive.toFixed(1)}h · 游玩 ${d.play.toFixed(1)}h</small></div></article>`).join('')}<p class="note">这是页面规则生成的交互预览，并未调用 AI；正式产品将由 AI 生成内容，再套用南线同款完整报告模板。</p></main></body></html>`;
    }

    function downloadReport(){
      const blob=new Blob([standaloneReport()],{type:'text/html;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='我的自驾旅行计划.html'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast('已生成可独立打开的 HTML 路书。');
    }

    document.addEventListener('click',event=>{
      const variantButton=event.target.closest('[data-variant-nav]'); if(variantButton){setVariant(variantButton.dataset.variantNav);return;}
      const stageButton=event.target.closest('[data-stage]'); if(stageButton){const nextStage=Number(stageButton.dataset.stage);if(nextStage===4){requestCodexPlan();return;}goToStage(nextStage);return;}
      const prefButton=event.target.closest('[data-pref]'); if(prefButton){const key=prefButton.dataset.pref;const index=preferenceCycles.indexOf(state.prefs[key]||'off');state.prefs[key]=preferenceCycles[(index+1)%preferenceCycles.length];render();return;}
      const toggle=event.target.closest('[data-toggle]'); if(toggle){const key=toggle.dataset.toggle;state.answers[key]=!state.answers[key];render();return;}
      const candidateButton=event.target.closest('[data-candidate]'); if(candidateButton){updateCandidate(candidateButton.dataset.candidate,candidateButton.dataset.statusChoice);return;}
      const action=event.target.closest('[data-action]')?.dataset.action;
      if(action==='add-stop'){addStop();return;}
      if(action==='remove-stop'){const index=Number(event.target.closest('[data-index]').dataset.index);const removed=state.route.must.splice(index,1)[0];render();toast(`${removed} 已从必去点移除。`);return;}
      if(action==='move-stop'){const el=event.target.closest('[data-index]');const index=Number(el.dataset.index),next=index+Number(el.dataset.dir);if(next>=0&&next<state.route.must.length){[state.route.must[index],state.route.must[next]]=[state.route.must[next],state.route.must[index]];render();}return;}
      if(action==='generate'||action==='ai-plan'){requestCodexPlan();return;}
      if(action==='ai-candidates'){requestCodexCandidates();return;}
      if(action==='end-session'){endSession();return;}
      if(action==='show-state'){showState();return;}
      if(action==='focus-prev'){state.focusCandidate=(state.focusCandidate-1+candidates.length)%candidates.length;render();return;}
      if(action==='focus-next'){state.focusCandidate=(state.focusCandidate+1)%candidates.length;render();return;}
      if(action==='download'){downloadReport();return;}
      if(action==='print'){window.print();return;}
    });

    document.addEventListener('change',event=>{
      if(event.target.matches('[data-route-field]')){state.route[event.target.dataset.routeField]=event.target.value.trim()||'杭州';render();}
      if(event.target.matches('[data-answer]')){state.answers[event.target.dataset.answer]=event.target.value;render();}
    });

    document.addEventListener('keydown',event=>{
      if(event.key==='Enter'&&event.target?.id==='newMustStop'){ addStop(); return; }
      const tag=document.activeElement?.tagName; if(['INPUT','TEXTAREA','SELECT'].includes(tag)||document.activeElement?.isContentEditable) return;
      if(event.key==='ArrowLeft') setVariant('prev'); if(event.key==='ArrowRight') setVariant('next');
    });

    render();
    checkCodexStatus();
    if(location.protocol!=='file:') setInterval(checkCodexStatus,5000);
    registerPlannerTools().catch(()=>{});
  </script>
</body>
</html>
